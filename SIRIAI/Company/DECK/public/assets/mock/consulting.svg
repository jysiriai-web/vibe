<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="비즈니스 컨설팅 비주얼(가상)">
  <defs>
    <linearGradient id="kw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe1"/>
      <stop offset="0.6" stop-color="#f3eee2"/>
      <stop offset="1" stop-color="#eadfce"/>
    </linearGradient>
    <radialGradient id="kg1" cx="0.5" cy="0.16" r="0.55">
      <stop offset="0" stop-color="#ddd0ef" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ddd0ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kg2" cx="0.12" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#f6c9a8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f6c9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#kw)"/>
  <rect width="800" height="600" fill="url(#kg1)"/>
  <rect width="800" height="600" fill="url(#kg2)"/>
  <!-- 도트 그리드(설계 좌표) -->
  <g fill="#211a33" opacity="0.16">
    <g>
      <circle cx="160" cy="140" r="2.4"/><circle cx="260" cy="140" r="2.4"/><circle cx="360" cy="140" r="2.4"/><circle cx="460" cy="140" r="2.4"/><circle cx="560" cy="140" r="2.4"/><circle cx="640" cy="140" r="2.4"/>
      <circle cx="160" cy="240" r="2.4"/><circle cx="260" cy="240" r="2.4"/><circle cx="360" cy="240" r="2.4"/><circle cx="460" cy="240" r="2.4"/><circle cx="560" cy="240" r="2.4"/><circle cx="640" cy="240" r="2.4"/>
      <circle cx="160" cy="340" r="2.4"/><circle cx="260" cy="340" r="2.4"/><circle cx="360" cy="340" r="2.4"/><circle cx="460" cy="340" r="2.4"/><circle cx="560" cy="340" r="2.4"/><circle cx="640" cy="340" r="2.4"/>
      <circle cx="160" cy="440" r="2.4"/><circle cx="260" cy="440" r="2.4"/><circle cx="360" cy="440" r="2.4"/><circle cx="460" cy="440" r="2.4"/><circle cx="560" cy="440" r="2.4"/><circle cx="640" cy="440" r="2.4"/>
    </g>
  </g>
  <!-- 비어 있는 '자리'로 수렴하는 구조선 -->
  <g stroke="#211a33" fill="none" stroke-opacity="0.5" stroke-width="1.4">
    <path d="M120 470 L400 300"/>
    <path d="M680 130 L400 300"/>
    <path d="M150 150 L400 300"/>
    <path d="M650 460 L400 300"/>
  </g>
  <!-- 비어 있는 자리(점선 원) + 채워질 잉크 점 -->
  <circle cx="400" cy="300" r="34" fill="none" stroke="#211a33" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="5 6"/>
  <circle cx="400" cy="300" r="9" fill="#211a33"/>
  <line x1="64" y1="64" x2="736" y2="64" stroke="#211a33" stroke-opacity="0.12"/>
</svg>
