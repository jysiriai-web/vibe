<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SIRIAI — 105가 아니라, 6.</title>
<meta name="description" content="궁금한 것부터 하나씩. SIRIAI가 어떻게 일하는지 6가지 질문으로." />
<script>document.documentElement.classList.add('js')</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@1,6..96,500;1,6..96,600&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  :root{
    --paper:#f3eee2; --surface:#fff; --ink:#211a33;
    --ink-2:rgba(33,26,51,.74); --ink-3:rgba(33,26,51,.58);
    --hair:rgba(33,26,51,.15); --hair-2:rgba(33,26,51,.26);
    --peach:rgba(246,201,168,.5); --lilac:rgba(221,208,239,.45); --cream:rgba(255,224,196,.4);
    --glass:rgba(255,255,255,.6);
    --shadow:0 16px 44px rgba(33,26,51,.13); --shadow-soft:0 8px 24px rgba(33,26,51,.08);
    --ease:cubic-bezier(.22,1,.36,1);
    --en:"Helvetica Neue","Arimo","Pretendard",system-ui,sans-serif;
    --kr:"Pretendard","Helvetica Neue","Arimo",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --serif:"Bodoni Moda",Georgia,serif;
    --edge:clamp(20px,5vw,56px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--kr);color:var(--ink);line-height:1.62;font-size:16px;word-break:keep-all;
    -webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden;
    background:radial-gradient(60% 50% at 16% 6%,var(--peach),transparent 60%),radial-gradient(55% 45% at 88% 4%,var(--lilac),transparent 60%),var(--paper);
    background-attachment:fixed;}
  ::selection{background:var(--peach)}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  .label{font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:var(--ink-3)}
  .serif{font-family:var(--serif);font-style:italic;font-weight:500}
  .pill{display:inline-flex;align-items:center;gap:9px;font-family:var(--en);font-weight:600;font-size:15px;
    padding:14px 28px;border-radius:100px;background:var(--ink);color:var(--paper);
    transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
  .pill:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .pill.ghost{background:transparent;color:var(--ink);border:1px solid var(--hair-2)}
  .pill.ghost:hover{border-color:var(--ink)}
  .pill .arr{font-family:var(--serif);font-style:italic}

  .top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
    padding:16px var(--edge);backdrop-filter:blur(6px)}
  .top .mk{font-family:var(--en);font-weight:700;letter-spacing:.16em;font-size:14px}
  .top .contact{font-family:var(--en);font-size:12.5px;padding:8px 16px;border-radius:100px;background:var(--ink);color:var(--paper)}

  .wrap{max-width:1040px;margin:0 auto;padding:0 var(--edge) 120px}

  /* board */
  .hero{padding:11vh 0 6vh;max-width:22ch}
  .hero .eyebrow{display:block;margin-bottom:22px}
  .hero h1{font-weight:600;font-size:clamp(28px,4.6vw,50px);line-height:1.16;letter-spacing:-.02em}
  .hero h1 .ac{font-family:var(--serif);font-style:italic;font-weight:500}
  .hero p{margin-top:18px;color:var(--ink-2);font-size:clamp(15px,1.3vw,18px);max-width:34ch}
  .meta{display:flex;align-items:center;gap:14px;margin:34px 0 4px}
  .meta .label{margin:0}
  .meta .ln{flex:1;height:1px;background:var(--hair)}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px}
  .card{display:flex;flex-direction:column;gap:12px;text-align:left;padding:24px 24px 22px;
    border:1px solid var(--hair);border-radius:18px;background:var(--glass);backdrop-filter:blur(10px);min-height:150px;
    transition:border-color .2s var(--ease),transform .2s var(--ease),box-shadow .2s var(--ease)}
  .card:hover{border-color:var(--hair-2);transform:translateY(-2px);box-shadow:var(--shadow-soft)}
  .card .n{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--ink-3)}
  .card .q{font-weight:600;font-size:clamp(16px,1.7vw,19px);letter-spacing:-.01em;line-height:1.32}
  .card .t{margin-top:auto;color:var(--ink-3);font-size:13px}
  .card .open{font-family:var(--serif);font-style:italic;color:var(--ink-3)}

  /* answer (document panel) */
  .doc{padding:8vh 0 2vh;max-width:680px}
  .back{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-3);margin-bottom:30px}
  .back:hover{color:var(--ink)}
  .doc .crumb{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:18px}
  .doc h2{font-weight:600;font-size:clamp(23px,3.2vw,34px);line-height:1.22;letter-spacing:-.015em}
  .doc .a{margin-top:22px;font-size:clamp(16px,1.3vw,18px);line-height:1.78;color:var(--ink)}

  .proof{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
  .stat{display:inline-flex;align-items:baseline;gap:7px;padding:9px 15px;border:1px solid var(--hair);border-radius:100px;background:var(--glass)}
  .stat .v{font-family:var(--en);font-weight:600;font-size:16px}
  .stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .brands{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
  .brand{padding:8px 15px;border:1px solid var(--hair);border-radius:100px;font-weight:600;font-size:14px;background:var(--glass)}
  .contrast{display:flex;gap:12px;margin-top:24px}
  .cside{flex:1;border:1px solid var(--hair);border-radius:14px;padding:16px;background:var(--glass)}
  .cside.a{opacity:.6}
  .cside .ct{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
  .cside .cv{font-size:14.5px;font-weight:500}
  .cvs{display:grid;place-items:center;font-family:var(--serif);font-style:italic;color:var(--ink-3)}

  .cta-row{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .cta-row .note{width:100%;color:var(--ink-3);font-size:13px;margin-top:6px}
  .cta-row .note a{border-bottom:1px solid var(--hair-2)}
  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:22px;border-top:1px solid var(--hair)}
  .nav button{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
  .nav button:hover{color:var(--ink)}
  .nav .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:3px}
  .nav .qt{font-weight:500;font-size:13.5px}
  .nav .right{text-align:right}

  .fade{animation:fade .45s var(--ease) both}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.fade{animation:none}.card,.pill{transition:none}}
  @media(max-width:640px){.grid{grid-template-columns:1fr}.contrast{flex-direction:column}}

  html:not(.js) #app{display:none}
  .nojs{display:none}
  html:not(.js) .nojs{display:block;padding:12vh var(--edge);max-width:640px;margin:0 auto}
</style>
</head>
<body>
<header class="top"><span class="mk">SIRIAI</span><a class="contact" href="mailto:jysiriai@gmail.com">Contact</a></header>

<main id="app" class="wrap" aria-live="polite"></main>

<section class="nojs">
  <p class="label">SIRIAI</p>
  <h1 style="font-weight:600;font-size:30px;margin:18px 0">궁금한 것부터, 하나씩.</h1>
  <p style="color:var(--ink-2)">자바스크립트가 필요한 데모입니다. <a href="mailto:jysiriai@gmail.com" style="border-bottom:1px solid">jysiriai@gmail.com</a></p>
</section>

<script>
(function(){
  var MAIL='mailto:jysiriai@gmail.com?subject=%5BSIRIAI%5D%20%ED%98%91%EC%97%85%20%EC%A0%9C%EC%95%88';
  var KAKAO='https://open.kakao.com/o/sPb2dMfi';
  var params=new URLSearchParams(location.search);
  var brand=(params.get('b')||params.get('brand')||'').trim();
  var who=brand?esc(brand)+'의':'당신의';

  var QA={
    portfolio:{n:'01',cat:'레퍼런스',q:'누구와 협업했나요?',teaser:'함께한 브랜드들.',
      a:'8division, 무신사, 이니스프리, 코스알엑스 등 다양한 브랜드와 함께해 왔고, 지금도 여러 브랜드와 진행 중입니다.',
      brands:['8division','무신사','이니스프리','코스알엑스'],
      cta:{label:'포트폴리오 확인하기',href:'#',ghost:true},next:'ai'},
    ai:{n:'02',cat:'방식',q:'AI로 인플루언서를 찾는다는 게?',teaser:'풀이 아니라, 발굴.',
      a:'가입자 풀에서 고르는 게 아니라, AI가 인스타그램 전체를 매번 새로 훑어 브랜드 결에 맞는 크리에이터를 발굴합니다. 그래서 캠페인마다 후보가 새로 올라옵니다.',
      contrast:['가입자 풀에서 고르기','결을 읽고, 발굴하기'],next:'overseas'},
    overseas:{n:'03',cat:'권역',q:'해외도 되나요?',teaser:'북미·중국까지.',
      a:'75개국·12개+ 플랫폼에서 현지 나노 인플루언서로 시딩합니다. 해외는 현지 파트너의 실행으로 진행해, 북미·중국까지 권역별로 좁혀 갑니다.',
      stats:[['75개국','커버리지'],['12+','플랫폼']],next:'postpay'},
    postpay:{n:'04',cat:'비용',q:'후불제가 뭐예요?',teaser:'리스크는 같이.',
      a:'착수금 20%로 시작하고, 실제 업로드된 분만 정산합니다. 안 올라오면 청구되지 않으니 리스크를 함께 집니다. 업로드율 100%로 유지해 온 방식입니다.',
      stats:[['100%','업로드율'],['20%','착수금']],next:'start'},
    start:{n:'05',cat:'시작',q:'뭐부터 해야 할지 모르겠어요',teaser:'목표만 가져오세요.',
      a:'목표만 들려주시면 됩니다. 단순 마케팅이 아니라, 비어 있는 자리부터 같이 찾습니다. 3~4일 안에 첫 후보 리스트로 결과를 보여드려요.',
      cta:{label:'협업 제안 보내기',href:MAIL},next:'about'},
    about:{n:'06',cat:'소개',q:'SIRIAI가 뭐예요?',teaser:'감성과 기술 사이.',
      a:'좋은 브랜드를 시장과 ‘아는 사이’로 만드는 팀입니다. 감성과 기술을 같이 씁니다.',
      cta:{label:'아직 확신이 안 서면 — 홈페이지',href:'#',ghost:true},next:'portfolio'},
  };
  var ORDER=['portfolio','ai','overseas','postpay','start','about'];
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var app=document.getElementById('app');

  function boardHTML(){
    var cards=ORDER.map(function(id){var x=QA[id];
      return '<button class="card" data-go="'+id+'"><span class="n">'+x.n+'</span><span class="q">'+esc(x.q)+'</span><span class="t">'+esc(x.teaser)+'</span><span class="open">열기 →</span></button>';
    }).join('');
    return '<section class="fade"><div class="hero">'+
      '<span class="label eyebrow">SIRIAI · 知り合い</span>'+
      '<h1>SIRIAI가 '+who+' 고민을 <span class="ac">해결</span>해 드립니다.</h1>'+
      '<p>105가 아니라, 6. 궁금한 것부터 하나씩 눌러보세요.</p></div>'+
      '<div class="meta"><span class="label">주제로 찾기</span><span class="ln"></span><span class="label">06</span></div>'+
      '<div class="grid">'+cards+'</div></section>';
  }
  function answerHTML(id){
    var x=QA[id];
    var extra='';
    if(x.brands)extra+='<div class="brands">'+x.brands.map(function(b){return '<span class="brand">'+esc(b)+'</span>';}).join('')+'</div>';
    if(x.stats)extra+='<div class="proof">'+x.stats.map(function(s){return '<span class="stat"><span class="v">'+s[0]+'</span><span class="k">'+s[1]+'</span></span>';}).join('')+'</div>';
    if(x.contrast)extra+='<div class="contrast"><div class="cside a"><div class="ct">기존</div><div class="cv">'+esc(x.contrast[0])+'</div></div><div class="cvs">→</div><div class="cside"><div class="ct">SIRIAI</div><div class="cv">'+esc(x.contrast[1])+'</div></div></div>';
    var cta;
    if(x.cta){cta='<a class="pill'+(x.cta.ghost?' ghost':'')+'" href="'+x.cta.href+'"'+(x.cta.href==='#'?' data-stub="1"':'')+'>'+esc(x.cta.label)+' <span class="arr">→</span></a>';}
    else{cta='<a class="pill" href="'+MAIL+'">협업 제안 보내기 <span class="arr">→</span></a>';}
    var note='<span class="note">이메일이 부담되면 — <a href="'+KAKAO+'" target="_blank" rel="noopener">오픈채팅으로 가볍게</a>.</span>';
    var i=ORDER.indexOf(id);
    var prev=ORDER[(i+ORDER.length-1)%ORDER.length], next=ORDER[(i+1)%ORDER.length];
    return '<section class="doc fade">'+
      '<a class="back" href="#">← 전체 질문으로</a>'+
      '<div class="crumb">'+x.n+' / 06 · '+esc(x.cat)+'</div>'+
      '<h2>'+esc(x.q)+'</h2>'+
      '<p class="a">'+esc(x.a)+'</p>'+extra+
      '<div class="cta-row">'+cta+note+'</div>'+
      '<div class="nav"><button data-go="'+prev+'"><div><span class="lbl">이전</span><span class="qt">← '+esc(QA[prev].q)+'</span></div></button>'+
      '<button class="right" data-go="'+next+'"><div><span class="lbl">다음</span><span class="qt">'+esc(QA[next].q)+' →</span></div></button></div>'+
    '</section>';
  }
  function render(){
    var h=(location.hash||'').replace(/^#/,'');
    app.innerHTML=QA[h]?answerHTML(h):boardHTML();
    window.scrollTo(0,0);
  }
  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-go]'); if(t){e.preventDefault();location.hash=t.getAttribute('data-go');return;}
    var s=e.target.closest('[data-stub]'); if(s){e.preventDefault();alert('데모: 실제로는 여기서 홈페이지/포트폴리오(deck)로 이동합니다.');}
  });
  window.addEventListener('hashchange',render);
  render();
})();
</script>
</body>
</html>
