<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SIRIAI — 무엇이 궁금하세요?</title>
<meta name="description" content="궁금한 걸 고르면, 그 자리에서 답과 이어지는 질문을 보여드립니다." />
<script>document.documentElement.classList.add('js')</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@1,6..96,500;1,6..96,600&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  :root{
    --paper:#f3eee2; --surface:#fff; --ink:#211a33;
    --ink-2:rgba(33,26,51,.74); --ink-3:rgba(33,26,51,.56);
    --hair:rgba(33,26,51,.13); --hair-2:rgba(33,26,51,.24);
    --peach:rgba(246,201,168,.5); --lilac:rgba(221,208,239,.45); --cream:rgba(255,224,196,.42);
    --glass:rgba(255,255,255,.6); --sel:rgba(255,255,255,.92);
    --shadow:0 16px 44px rgba(33,26,51,.13); --shadow-soft:0 8px 24px rgba(33,26,51,.08);
    /* 무드 = 느림 */
    --ease:cubic-bezier(.4,0,.12,1);
    --slow:.95s; --fade:.9s; --med:.55s;
    --en:"Helvetica Neue","Arimo","Pretendard",system-ui,sans-serif;
    --kr:"Pretendard","Helvetica Neue","Arimo",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --serif:"Bodoni Moda",Georgia,serif;
    --edge:clamp(20px,4vw,44px); --hh:58px; --fh:40px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--kr);color:var(--ink);line-height:1.6;font-size:16px;word-break:keep-all;
    -webkit-font-smoothing:antialiased;overflow:hidden;
    background:radial-gradient(60% 50% at 14% 6%,var(--peach),transparent 60%),radial-gradient(55% 48% at 90% 4%,var(--lilac),transparent 60%),var(--paper);
    background-attachment:fixed;}
  ::selection{background:var(--peach)}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  .label{font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:var(--ink-3)}
  .serif{font-family:var(--serif);font-style:italic;font-weight:500}
  .pill{display:inline-flex;align-items:center;gap:9px;font-family:var(--en);font-weight:600;font-size:14.5px;
    padding:13px 26px;border-radius:100px;background:var(--ink);color:var(--paper);transition:transform var(--med) var(--ease),box-shadow var(--med) var(--ease)}
  .pill:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .pill.sm{padding:11px 20px;font-size:13.5px}
  .pill .arr{font-family:var(--serif);font-style:italic}

  .top{height:var(--hh);display:flex;align-items:center;justify-content:space-between;padding:0 var(--edge);flex:none}
  .top .mk{font-family:var(--en);font-weight:700;letter-spacing:.16em;font-size:14px}
  .top .jp{font-family:"Hiragino Sans","Noto Sans JP",var(--kr);font-size:12px;color:var(--ink-3)}

  #intro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
    background:radial-gradient(60% 50% at 14% 6%,var(--peach),transparent 60%),radial-gradient(55% 48% at 90% 4%,var(--lilac),transparent 60%),var(--paper);
    transition:opacity var(--fade) var(--ease)}
  #intro.gone{opacity:0;pointer-events:none}
  #intro .mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 var(--edge);max-width:1100px;margin:0 auto;width:100%}
  #intro .eyebrow{display:block;margin-bottom:24px}
  #intro h1{font-weight:600;font-size:clamp(30px,5vw,56px);line-height:1.14;letter-spacing:-.02em;max-width:16ch}
  #intro h1 b{font-weight:600}
  #intro p{margin-top:20px;color:var(--ink-2);font-size:clamp(15px,1.4vw,19px);max-width:32ch;line-height:1.7}
  #intro .go{margin-top:38px}
  #intro .hint{margin-top:18px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

  #app{height:100%;display:flex;flex-direction:column}
  .stage{flex:1;min-height:0;position:relative;display:flex;padding:6px var(--edge) 0;max-width:1200px;margin:0 auto;width:100%}

  /* ── 왼쪽 Q 패널: 오버레이 — 접혀도 본문은 안 밀림(2번) ── */
  .pick{position:absolute;left:var(--edge);top:6px;bottom:0;width:360px;max-width:44%;overflow:hidden;border-radius:16px;border:1px solid transparent;background:var(--glass);z-index:6;
    transition:width var(--slow) var(--ease),border-color var(--slow) var(--ease),box-shadow var(--slow) var(--ease)}
  .pickbody{display:flex;flex-direction:column;height:100%;min-height:0}
  .pick .ttl{font-weight:600;font-size:clamp(18px,1.9vw,23px);letter-spacing:-.01em;margin-bottom:4px}
  .pick .sub{color:var(--ink-3);font-size:13px;margin-bottom:18px}
  .qcap{display:none;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding:4px 0 14px}
  .qlist{display:flex;flex-direction:column;gap:9px;overflow:auto;padding:2px;min-height:0;scrollbar-width:none}
  .qlist::-webkit-scrollbar{display:none}
  .q{display:flex;align-items:center;gap:13px;text-align:left;padding:16px 18px;border:1px solid var(--hair);border-radius:14px;
    background:var(--glass);backdrop-filter:blur(8px);transition:border-color var(--med) var(--ease),background var(--med) var(--ease),padding var(--slow) var(--ease);
    opacity:0;transform:translateY(10px);animation:qin var(--fade) var(--ease) forwards}
  .q:nth-child(1){animation-delay:.05s}.q:nth-child(2){animation-delay:.16s}.q:nth-child(3){animation-delay:.27s}.q:nth-child(4){animation-delay:.38s}.q:nth-child(5){animation-delay:.49s}
  @keyframes qin{to{opacity:1;transform:none}}
  .q .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none;transition:color var(--med)}
  .q .qt{font-weight:500;font-size:15px;letter-spacing:-.01em;line-height:1.35;transition:opacity var(--med) var(--ease)}
  .q:hover{border-color:var(--hair-2);background:var(--sel)}
  .q.on{border-color:var(--ink);background:var(--sel);box-shadow:var(--shadow-soft)}
  .q.on .n{color:var(--ink)}
  /* 왼쪽 하단 — 빈칸을 브랜드 한마디로 */
  .pickfoot{margin-top:auto;padding:22px 4px 8px;color:var(--ink-3);font-size:13.5px;line-height:1.75;border-top:1px solid var(--hair)}
  .pickfoot .serif{color:var(--ink-2)}

  /* 접힘: 번호만 보이고(=질문 리스트인 걸 알게), 현재 질문 강조 */
  .stage.focus .pick{width:66px;cursor:pointer;border-color:var(--hair)}
  .stage.focus .out{margin-left:calc(66px + 18px)}
  .stage.focus .pick .ttl,.stage.focus .pick .sub,.stage.focus .pick .pickfoot{display:none}
  .stage.focus .pick .qcap{display:block}
  .stage.focus .pick .q{justify-content:center;padding:14px 6px}
  .stage.focus .pick .q .qt{opacity:0;width:0;overflow:hidden;white-space:nowrap}
  /* 호버 → 천천히 다시 펼침 */
  .stage.focus .pick:hover,.stage.focus .pick:focus-within{width:340px;background:var(--surface);box-shadow:var(--shadow)}
  .stage.focus .pick:hover .ttl,.stage.focus .pick:focus-within .ttl{display:block}
  .stage.focus .pick:hover .sub,.stage.focus .pick:focus-within .sub,.stage.focus .pick:hover .pickfoot,.stage.focus .pick:focus-within .pickfoot{display:block}
  .stage.focus .pick:hover .qcap,.stage.focus .pick:focus-within .qcap{display:none}
  .stage.focus .pick:hover .q,.stage.focus .pick:focus-within .q{justify-content:flex-start;padding:16px 18px}
  .stage.focus .pick:hover .q .qt,.stage.focus .pick:focus-within .q .qt{opacity:1;width:auto;overflow:visible}

  /* ── 오른쪽: 답 (타자기 없이 부드러운 슬로우 페이드) ── */
  .out{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;
    margin-left:calc(360px + clamp(18px,2.4vw,32px));transition:margin-left var(--slow) var(--ease);
    border:1px solid var(--hair);border-radius:20px;background:var(--surface);box-shadow:var(--shadow-soft);
    padding:clamp(24px,2.8vw,42px);overflow:hidden}
  .greet{margin:auto;text-align:center;color:var(--ink-3);max-width:32ch}
  .greet .label{display:block;margin-bottom:12px}
  .greet p{font-size:16px;line-height:1.8}
  /* 제목 섹션(고정) / 본문 섹션(타이핑·성장) 분리 */
  .head-sec{flex:none;padding-top:clamp(18px,6.5vh,70px)}
  .body-sec{flex:1;min-height:0;overflow:auto;margin-top:22px}
  .body-sec::-webkit-scrollbar{width:6px} .body-sec::-webkit-scrollbar-thumb{background:var(--hair-2);border-radius:6px}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  /* 헤드라인만 부드럽게(패널 전체 새로고침 느낌 제거) */
  .out h2,.out .crumb{animation:hfade var(--med) var(--ease) both}
  @keyframes hfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .cursor{display:inline-block;width:2px;height:1.04em;background:var(--ink);vertical-align:-2px;margin-left:1px;animation:blink 1.1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .out .crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:16px;display:flex;align-items:center;gap:10px}
  .out .crumb .dot{width:5px;height:5px;border-radius:50%;background:var(--ink);opacity:.5}
  .out h2{font-weight:600;font-size:clamp(26px,3.1vw,42px);line-height:1.2;letter-spacing:-.02em}
  .out .ans{font-size:clamp(17px,1.55vw,22px);line-height:1.85;color:var(--ink);max-width:40ch}
  .proof{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
  .stat{display:inline-flex;align-items:baseline;gap:6px;padding:8px 14px;border:1px solid var(--hair);border-radius:100px;background:var(--glass)}
  .stat .v{font-family:var(--en);font-weight:600;font-size:14px}
  .stat .k{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

  .followups{margin-top:30px}
  .followups .fl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:12px}
  .fchips{display:flex;flex-wrap:wrap;gap:9px}
  .fchip{display:inline-flex;align-items:center;gap:8px;padding:11px 17px;border:1px solid var(--hair);border-radius:100px;background:var(--glass);
    font-weight:500;font-size:13.5px;letter-spacing:-.01em;text-align:left;transition:border-color var(--med) var(--ease),transform var(--med) var(--ease)}
  .fchip:hover{border-color:var(--hair-2);transform:translateY(-1px)}
  .fchip .go{font-family:var(--serif);font-style:italic;color:var(--ink-3);flex:none}

  .foot-cta{margin-top:30px;padding-top:24px;border-top:1px solid var(--hair);display:flex;flex-wrap:wrap;align-items:center;gap:12px;animation:rise var(--fade) var(--ease) both}
  .ref{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;color:var(--ink);border:1px solid var(--hair-2);border-radius:100px;padding:10px 18px;transition:border-color var(--med),background var(--med)}
  .ref:hover{border-color:var(--ink);background:var(--glass)}
  .ref .ic{font-family:var(--serif);font-style:italic;color:var(--ink-3)}
  .foot-cta .note{width:100%;color:var(--ink-3);font-size:12.5px;margin-top:2px}
  .foot-cta .note a{border-bottom:1px solid var(--hair-2)}
  .foot-cta .note a:hover{border-color:var(--ink)}

  .backm{display:none}

  /* 미니 푸터 한 줄 */
  .foot{height:var(--fh);display:flex;align-items:center;gap:14px;padding:0 var(--edge);flex:none;font-size:11px;color:var(--ink-3)}
  .foot .mk{font-family:var(--en);font-weight:700;letter-spacing:.14em;color:var(--ink-2)}
  .foot .r{margin-left:auto;font-family:var(--mono);letter-spacing:.12em}

  @media(max-width:820px){
    body{overflow:auto}
    #app{height:auto;min-height:100%}
    .stage{flex-direction:column;height:auto;padding-bottom:30px}
    .pick,.stage.focus .pick,.stage.focus .pick:hover{position:static;width:auto;max-width:none;overflow:visible;border-color:transparent;background:transparent;box-shadow:none}
    .out,.stage.focus .out{margin-left:0}
    .stage.focus .pick .ttl,.stage.focus .pick .sub{display:block}
    .stage.focus .pick .qcap{display:none}
    .stage.focus .pick .q{justify-content:flex-start;padding:16px 18px}
    .stage.focus .pick .q .qt{opacity:1;width:auto;overflow:visible}
    .qlist{overflow:visible}
    .out{display:none}
    .stage.showout .pick{display:none}
    .stage.showout .out{display:flex;min-height:62vh}
    .backm{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3);margin-bottom:14px}
    .foot{height:auto;padding:16px var(--edge) 24px;flex-wrap:wrap}
  }
  @media(prefers-reduced-motion:reduce){.q,.inner,.foot-cta{animation:none;opacity:1;transform:none}#intro,.pick,.q{transition:none}}
  html:not(.js) #intro .go{display:none}
</style>
</head>
<body>

<div id="app">
  <header class="top"><span class="mk">SIRIAI</span><span class="jp">知り合い</span></header>
  <div class="stage" id="stage">
    <section class="pick" id="pick" tabindex="0">
      <div class="pickbody">
        <div class="qcap">질문</div>
        <div class="ttl" id="pickTtl">무엇이 궁금하세요?</div>
        <div class="sub">궁금한 것 하나만 눌러보세요.</div>
        <div class="qlist" id="qlist"></div>
        <div class="pickfoot">좋은 브랜드가 안 알려지는 건,<br>도달이 아니라 <span class="serif">관계</span>의 문제니까요.</div>
      </div>
    </section>
    <section class="out" id="out"></section>
  </div>
  <div class="foot"><span class="mk">SIRIAI</span><span>知り合い — 아는 사이</span><span class="r">Signal · Structure · Decision</span></div>
</div>

<div id="intro">
  <header class="top"><span class="mk">SIRIAI</span><span class="jp">知り合い</span></header>
  <div class="mid">
    <span class="label eyebrow">SIRIAI · 知り合い</span>
    <h1 id="headline">SIRIAI가 <b>당신의</b> 고민을<br>해결해 드립니다.</h1>
    <p>좋은 브랜드가 안 알려지는 건, 도달이 아니라 <span class="serif">관계</span>의 문제니까요.</p>
    <div class="go"><button class="pill" id="startBtn">궁금한 것부터 <span class="arr">→</span></button></div>
    <div class="hint">고르기만 하면 됩니다 · 천천히</div>
  </div>
</div>

<script>
(function(){

  var KAKAO='https://open.kakao.com/o/sPb2dMfi';

  var brand=(params.get('b')||params.get('brand')||'').trim();
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  if(brand){ document.getElementById('headline').innerHTML='SIRIAI가 <b>'+esc(brand)+'의</b> 고민을<br>해결해 드립니다.'; document.getElementById('pickTtl').textContent=esc(brand)+'님, 무엇이 궁금하세요?'; }

  var QA={
    portfolio:{n:'01',cat:'레퍼런스',hero:true,q:'누구와 협업했나요?',
      a:'8division, 무신사, 이니스프리, 코스알엑스 등 다양한 브랜드와 함께해 왔고, 지금도 여러 브랜드와 진행 중입니다. 뷰티부터 글로벌 챌린지까지, 브랜드 결에 맞춰 왔어요.',
      ref:'포트폴리오 전체 보기',follow:['newbrand','overseas']},
    ai:{n:'02',cat:'방식',hero:true,q:'AI로 인플루언서를 찾는다는 게 무슨 뜻이죠?',
      a:'가입자 풀에서 고르는 게 아니라, AI가 인스타그램 전체를 매번 새로 훑어 브랜드 결에 맞는 크리에이터를 발굴합니다. 정형화된 리스트가 아니라, 캠페인 목적에 맞춰 매번 새로 짜는 구조예요.',
      ref:'발굴 사례 보기',follow:['fit','overseas']},
    fit:{n:'03',cat:'선별',hero:true,q:'우리 브랜드에 맞는 인플루언서는 어떻게 고르나요?',
      a:'톤, 팔로워 결, 콘텐츠 맥락을 함께 보고 브랜드와 자연스럽게 붙는 크리에이터만 추립니다. 권역·카테고리를 먼저 들으면 더 정밀하게 필터링해 드려요.',
      ref:'선별 사례 보기',follow:['count','flow']},
    overseas:{n:'04',cat:'해외',hero:true,q:'해외(미국·중국) 진출도 되나요?',
      a:'75개국·12개+ 플랫폼에서 현지 파트너의 실행으로 시딩합니다. 미국은 아마존 진입부터 물류·콘텐츠 업로드까지 한 번에 지원하고, 중국까지 권역별로 좁혀 들어갑니다.',
      stats:[['75개국','커버리지'],['12+','플랫폼']],ref:'글로벌 사례 보기',follow:['price','flow']},
    postpay:{n:'05',cat:'비용',hero:true,q:'후불제라는데 정확히 어떤 구조예요?',
      a:'착수금 20%로 시작하고, 실제 업로드가 완료된 분만 정산하는 구조입니다. 약속한 콘텐츠가 올라오지 않으면 청구되지 않으니, 리스크를 저희가 함께 집니다. 업로드율 100%를 유지해 온 방식이라 가능한 구조예요.',
      stats:[['20%','착수금'],['100%','업로드율']],ref:'후불 사례 보기',follow:['price','onboard']},
    flow:{cat:'프로세스',q:'전체 진행 절차가 어떻게 되나요?',
      a:'목표를 진단하고, 3~4일 내 후보 리스트를 드린 뒤 섭외와 발송, 업로드, 리포트로 이어집니다. 단계마다 결과를 공유드리며 진행해, 중간에 방향도 조정할 수 있어요.',
      stats:[['3~4일','첫 리스트'],['14일','평균 영업일']],ref:'진행 사례 보기',follow:['onboard','count']},
    count:{cat:'선별',q:'몇 명 정도 후보를 추려주시나요?',
      a:'정해진 인원이 아니라 캠페인 목적과 권역에 맞춰 규모를 잡습니다. 3~4일 내 1차 리스트로 결을 먼저 확인하신 뒤, 함께 폭을 조정합니다.',
      ref:'선별 사례 보기',follow:['price','fit']},
    price:{cat:'비용',q:'그래서 가격이 얼마인가요?',
      a:'단가표를 먼저 들이밀기보다, 목표와 규모를 듣고 가장 린한 구조를 역제안합니다. 원하시는 결과를 먼저 알려주시면, 거기에 맞춰 구조부터 짜 드려요.',
      ref:'견적 흐름 보기',ctaLeaf:true,follow:['onboard']},
    onboard:{cat:'착수',q:'그럼 어떻게 시작하면 되나요?',
      a:'브랜드와 제품, 이번 캠페인의 목표만 공유해 주시면 시작할 수 있습니다. 착수금 20%로 출발해 3~4일 내 후보 리스트로 첫 결과를 보여 드려요. 준비물은 많지 않아요. 목표부터 편하게 들려주세요.',
      ref:'착수 절차 보기',ctaLeaf:true,follow:['price']},
    newbrand:{cat:'레퍼런스',q:'우리처럼 신생 브랜드도 받아주나요?',
      a:'규모보다 브랜드가 가려는 방향이 분명한지를 봅니다. 막 시작하는 브랜드일수록 작게 검증하며 키우는 구조가 잘 맞아, 단발 테스트로 결을 확인한 뒤 확장하는 흐름을 자주 권해요.',
      ref:'신생 브랜드 사례',follow:['portfolio','fit']},
  };
  var HERO=['portfolio','ai','fit','overseas','postpay'];

  var qlist=document.getElementById('qlist'), out=document.getElementById('out'), stage=document.getElementById('stage'), pick=document.getElementById('pick');
  qlist.innerHTML=HERO.map(function(id){var x=QA[id];
    return '<button class="q" data-id="'+id+'"><span class="n">'+x.n+'</span><span class="qt">'+esc(x.q)+'</span></button>';
  }).join('');

  var GREET='<div class="greet"><span class="label">SIRIAI · 知り合い</span><p>왼쪽에서 궁금한 걸 하나 눌러보세요.<br>천천히, 바로 답해 드릴게요.</p></div>';
  out.innerHTML=GREET;

  var seen={}, count=0, ctaUnlocked=false, typer=null;
  function highlight(id){ qlist.querySelectorAll('.q').forEach(function(el){el.classList.toggle('on',el.getAttribute('data-id')===id);}); }
  function typewrite(el,text){
    if(typer){clearInterval(typer);typer=null;}
    if(!el)return;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=text;return;}
    el.innerHTML='<span class="cursor"></span>'; var i=0;
    typer=setInterval(function(){ i++; el.innerHTML=esc(text.slice(0,i))+'<span class="cursor"></span>';
      if(i>=text.length){clearInterval(typer);typer=null;el.textContent=text;} },27); // 차분한 속도
  }
  function render(id){
    var x=QA[id]; if(!x)return;
    var extra='';
    if(x.stats)extra+='<div class="proof">'+x.stats.map(function(s){return '<span class="stat"><span class="v">'+s[0]+'</span><span class="k">'+s[1]+'</span></span>';}).join('')+'</div>';
    var fol=(x.follow||[]).filter(function(f){return QA[f];});
    var folHTML=fol.length?'<div class="followups"><span class="fl">이어서 물어보기</span><div class="fchips">'+
      fol.map(function(f){return '<button class="fchip" data-id="'+f+'"><span>'+esc(QA[f].q)+'</span><span class="go">→</span></button>';}).join('')+'</div></div>':'';
    if(x.ctaLeaf || count>=3) ctaUnlocked=true;
    var footHTML=ctaUnlocked?'<div class="foot-cta">'+
      '<a class="ref" href="#_" data-stub="1">'+esc(x.ref)+' <span class="ic">→</span></a>'+
      '<a class="pill sm" href="'+MAIL+'">협업 제안 보내기 <span class="arr">→</span></a>'+
      '<span class="note">이메일이 부담되면 — <a href="'+KAKAO+'" target="_blank" rel="noopener">오픈채팅으로 가볍게</a>.</span></div>':'';
    var crumb=x.n?(x.n+' / 0'+HERO.length+'<span class="dot"></span>'+esc(x.cat)):('이어서<span class="dot"></span>'+esc(x.cat));
    out.innerHTML='<div class="head-sec">'+
      '<a class="backm" href="#_" data-back="1">← 다른 질문</a>'+
      '<div class="crumb">'+crumb+'</div>'+
      '<h2>'+esc(x.q)+'</h2></div>'+
      '<div class="body-sec"><p class="ans" id="ans"></p>'+extra+folHTML+footHTML+'</div>';
    highlight(id);
    typewrite(document.getElementById('ans'), x.a);
  }
  function open(id){
    if(!QA[id])return;
    if(!seen[id]){seen[id]=1;count++;}
    render(id);
    stage.classList.add('focus');
    stage.classList.add('showout');
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  qlist.addEventListener('click',function(e){var b=e.target.closest('[data-id]');if(b)open(b.getAttribute('data-id'));});
  out.addEventListener('click',function(e){
    var f=e.target.closest('.fchip'); if(f){e.preventDefault();open(f.getAttribute('data-id'));return;}
    if(e.target.closest('[data-stub]')){e.preventDefault();alert('데모: 실제로는 여기서 포트폴리오/사례(홈페이지·deck)로 이동합니다.');return;}
    if(e.target.closest('[data-back]')){e.preventDefault();stage.classList.remove('showout');}
  });

  var intro=document.getElementById('intro');
  function start(pre){ intro.classList.add('gone'); setTimeout(function(){intro.style.display='none';},900); if(pre)open(pre); }
  document.getElementById('startBtn').addEventListener('click',function(){start();});
  function fromHash(){var h=(location.hash||'').replace(/^#/,'');if(QA[h]){start(h);}}
  window.addEventListener('hashchange',fromHash);
  if(QA[(location.hash||'').replace(/^#/,'')]) fromHash();
})();
</script>
</body>
</html>
