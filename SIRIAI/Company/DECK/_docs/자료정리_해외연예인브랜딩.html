const DATA=[{"key":"연예인 (셀러브리티·IP)","md":"# ③ 연예인 (셀럽·IP) — QA 후보 정보 정리\n\n> SIRIAI '연예인·셀럽·IP' 영역 수집자료를 QA 작성용으로 주제별 정리. 핵심 출처는 **틈결(성수/서울숲 라이프스타일 공간) × 에스더버니(캐릭터 IP) 플래그십 아뜰리에** 단일 캠페인(2026.5.2, 실발주 브랜드 = 셀바이오휴먼텍 '루솜').\n> **★ 3중 게이트 상시 적용:** 셀럽·소속사 실명 / 단가·마진 / 미검증 정량수치 = 전부 비식별·'협의'·보류 처리. 아래 표의 [메모] 칸에 게이트 표시.\n\n---\n\n## 1. 서비스 정의 — \"연예인도 되나요?\"\n\n**질문 후보:** \"연예인/아이돌·배우도 섭외되나요? 뭘 해주나요?\"\n\n**답에 들어갈 핵심**\n- 연예인·셀럽 협찬·캐스팅 가능. **직접 섭외보다 소속사/협력사 경유 3자 구조**가 기본 모델.\n- 단발 협찬이 아니라 **풀패키지 실행**: 캐스팅·섭외 → 현장 디렉팅·콘텐츠 기획·운영 → 셀럽 블로그 SEO 발행 → 캐릭터 IP 굿즈 시딩 → 메가~나노 풀스택 운영.\n- 스타일링 시딩 트랙: 스타일리스트가 편집샵에서 픽업, 셀럽 착장 정보를 콘텐츠/SEO로 자산화(연예인 직접 기용 아님).\n\n**출처:** `C:/Users/whwns/Desktop/SIRIAI/01. 영업/내방 미팅 회의록/태초 미팅.txt` (라인 60~65, 106~134) / `…/QA_섹션_콘텐츠.md` ③ 섹션 / 통합 note\n\n**[메모]** 확정(서비스 범위 서술은 안전). 단가·실명 비노출. **이 섹션이 현재 QA 페이지에서 거의 비어 있어(전부 `[팀 확정]` placeholder) 1순위 메움 대상.**\n\n---\n\n## 2. 대표 실행 사례 — \"실제로 누구를 데려왔나\"\n\n**질문 후보:** \"실제로 K-pop/배우급 셀럽 섭외해서 캠페인 돌린 적 있나요?\"\n\n**답에 들어갈 핵심 (전부 비식별 표기)**\n- 캐릭터 IP 플래그십 팝업에 **메가 라인업 캐스팅 운영**: 국내 대형 엔터 소속 아이돌 1인 + 배우급 인플루언서 1인 + 100만급 웹매거진(현장취재 릴스).\n- 셀럽별 소속사 매니저 동행, **경호 용역 별도 발주**(동선·전용주차·하차 협의)까지 SIRIAI 코디.\n- 당일 SIRIAI 역할 = 현장 사전점검(조명·공간) → 셀럽 픽업·에스코트 → 착장 피팅 → 인터뷰 현장 조율 → 제품 반납 확인.\n\n**출처 (원본, 실명 포함 — 비식별 후 사용):** `…/틈결/기획·PRD/에스더버니_메가인플루언서_개요_v3.docx` / `에스더버니_메가_콘텐츠기획초안_정리본.xlsx`(드라이브 id 1thVWifc…) / Gmail threadId 19d6bee14c08b92e\n\n**[메모]** ★대외비·수위조절 대상(건진_정보.md 명시). 실명(릴리/김고은/JYP/HYBE 등)은 **공개동의 게이트 통과 후에만**. 현재는 비식별('국내 대형 엔터 아이돌 1인 + 배우급 1인 + 100만 매거진') 전제.\n\n---\n\n## 3. 셀럽 캐스팅 풀·스케일 — \"어느 급까지 닿나\"\n\n**질문 후보:** \"어느 정도급 연예인까지 섭외 가능한가요?\"\n\n**답에 들어갈 핵심**\n- 아이돌 그룹·배우·예능출연자까지 **폭넓은 캐스팅 풀** + 협상가·마진율까지 관리(섭외 후보 50명+ 트래킹).\n- 국내외 **엔터 협력 네트워크** 보유(협력사 경유 섭외 구조 뒷받침).\n- 미디어 취재 연계(웹매거진 현장취재 릴스)도 동시 운영.\n\n**출처:** 드라이브 통합/내부공유 시트(id 1cb1TOj…, 1WB6ofd…) / `featuring_influencer`(id 1skpzwQW…) / `…/아웃바운드/PI 코퍼레이션 진행 연예인 리스트.txt` / Gmail 아이즈매거진 thread 19d5277e…\n\n**[메모]** ★실명 리스트(엔믹스·레드벨벳·소녀시대·STAYC·RIIZE·aespa 등) = 미검증·미동의 → QA 직접노출 **금지**. '아이돌·배우급 메가 캐스팅 풀 + 엔터 협력 네트워크 보유' 수준 비식별만. PI 코퍼레이션이 확정 협력처인지 **불명(아래 더 확인)**.\n\n---\n\n## 4. 셀럽 디렉팅·콘텐츠 운영 — \"데려다 놓기만 하나?\"\n\n**질문 후보:** \"연예인 섭외하면 콘텐츠까지 챙겨주나요?\"\n\n**답에 들어갈 핵심**\n- **분 단위 당일 타임라인 + 공간 활용 디렉팅(촬영 포인트·무드·동선) + 콘텐츠 납품 기준 + 소속사 컨펌 프로세스**까지 직접 설계·운영.\n- 납품 기준 표준: 방문 후 D+2~3 업로드, 브랜드 공동작업자 태그 필수, 소속사 내부 컨펌 후 업로드.\n- 무드 원칙: \"과하게 광고적이지 않게 — 공간을 경험하는 셀럽의 리얼한 반응 중심.\"\n- **셀럽별 콘텐츠 차별 설계**(글로벌/우아 vs 발랄 vs 현장취재 인터뷰 등 강점 기반).\n- 3자 협업 운영구조: SIRIAI(현장 디렉팅) × 브랜드사 × 소속사 매니저.\n\n**출처:** `…/틈결/기획·PRD/릴리_셀럽디렉팅_초안_v1.docx` / `에스더버니_메가_콘텐츠기획초안_정리본.xlsx`\n\n**[메모]** 확정(프로세스 자체는 비식별로 그대로 QA화 가능). '끝까지 곁에' 차별점 증거로 강력.\n\n---\n\n## 5. 계약·법무·초상권 정산 — \"초상권·계약은 어떻게?\"\n\n**질문 후보:** \"셀럽 계약·초상권·정산은 어떻게 처리하나요?\"\n\n**답에 들어갈 핵심**\n- **3자 계약 중개 구조**로 계약·정산·초상권 권리범위 관리(브랜드–SIRIAI–소속사).\n- 계약 리스크 항목별 검토·보완 역량: 콘텐츠 조건(해시태그/계정태그), 위약금 구간(D-7·D-3), 선지급 연동·실손해 전가 조항, **게시물 유지기간(2차 활용·유지) 관리**.\n- 엔터급 실제 계약 프로세스 수행: 초안 검토 → 수정본 교환 → 소속사 법무검토 → 전자서명 → 세금계산서 발행.\n- 팀 역할분담: 계약·법무 = 박슬범 팀장 / 영업·제안 = 조준용 매니저.\n\n**출처:** `…/04. 계약서/에스더버니/contract_review_internal.html` / Gmail threadId 19d958b1…(JYP 계약서), 19e20e83…(데패뉴 세금계산서)\n\n**[메모]** ★금액(2,700만/1,500만/마진 900만~)·소속사 실명(레드빈)·셀럽 실명 = 단가비노출+대외비 게이트 → **정성 표현만**(\"3자 계약으로 권리범위·정산·초상권 관리\"). 프로세스·역량 서술은 안전.\n\n---\n\n## 6. 상품 모듈 (셀럽 블로그 SEO · IP 굿즈) — \"어떤 패키지가 있나\"\n\n**질문 후보:** \"셀럽/IP로 묶은 패키지가 있나요?\"\n\n**답에 들어갈 핵심**\n- **셀럽 블로그 SEO 발행**: 셀럽 착장(콜라보 제품) 기반 파워블로거 발행 → 검색유입 자산화. (예: \"제니 코첼라 착용\" 류 이슈를 블로그로 SEO화) — 단발·가벼운 진행 가능.\n- **캐릭터 IP 굿즈 시딩**: PB 굿즈(키링·악세사리·콜라보 수건) 협찬 후 인플루언서 착용 콘텐츠 + 자사몰/카카오 선물하기 오픈 연동.\n- **방문형 트랙** + 메가~나노 풀스택을 패키지로 묶어 제공.\n- 캠페인 운영 4단계: 분석&리스팅 → 가이딩&실행 → 콘텐츠 확산 → 결과 보고.\n\n**출처:** `…/틈결/기획·PRD/PRD_틈결x에스더버니_대시보드_v2.md` / 태초 미팅.txt(라인 61) / 콘텐츠 협의 인플루언서 리스트 시트(id 1rI3JMv…)\n\n**[메모]** ★패키지 가격(기본 400만/프리미엄 500만), 블로그 1건 30만원 = 단가비노출 → '협의' 처리. 모듈 구성(블로그 SEO·IP 굿즈·방문형) 자체는 노출 가능.\n\n---\n\n## 7. 현장 운영·안전 — \"행사 운영은 어디까지?\"\n\n**질문 후보:** \"셀럽 행사 현장 운영도 해주나요?\"\n\n**답에 들어갈 핵심**\n- 섭외에 그치지 않고 **행사 경호·현장 안전 운영까지 발주·코디**(경호요원+경비지도사 견적·수배).\n- 셀럽 동선·하차·전용주차 등 현장 보안 협의 포함.\n\n**출처:** `2604502 에스더버니 캠페인 팝업행사 경호 견적서.xlsx`(id 1WUJdc…) / Gmail threadId 19db3471…(팀레드 경호)\n\n**[메모]** 금액(견적 약 242만원) 비노출. 사실(경호·안전 운영 포함)만 QA화. 차별점 보강용.\n\n---\n\n## 8. 캐스팅 인프라·아웃리치 톤 — \"캐스팅은 어떻게 하나\"\n\n**질문 후보:** \"인플루언서·셀럽 캐스팅은 어떤 방식으로?\"\n\n**답에 들어갈 핵심**\n- 캐스팅 플랫폼(크리플래닛 등) + MCN/소속사 직접 컨택 **이원 운영**(의뢰서 등록→추천 리스트업→피저빌리티→캐스팅).\n- 컨셉 매칭형 캐스팅(브랜드 IP 이미지에 맞는 셀럽 제안).\n- 아웃리치 표준 조건: 현장 라이브 콘텐츠 + 공동작업자 등록 + 2차 활용 동의, 고료=협의.\n- 협상 원칙: \"2차 활용 시 모델료 상향\", \"공동작업자는 레이블 추가 협의\", \"착장은 비주얼팀 사전협의\".\n\n**출처:** Gmail 캐스팅 인프라 thread 19d27c6f… 외 / `…/아웃바운드/방문형 (메가).txt` / 태초 미팅.txt(라인 110)\n\n**[메모]** 아웃리치 톤·조건은 QA 어휘(따뜻한 해요체) 참고용으로 우수. 단가 구간(김무비 1,300만/릴스 70만 등)은 비노출.\n\n---\n\n## 9. 리텐션·실집행 실적 — \"실제 결제·재발주 건이 있나\"\n\n**질문 후보:** \"실제로 집행·결제된 셀럽/IP 건이 있나요? 재발주도 되나요?\"\n\n**답에 들어갈 핵심**\n- 미디어 취재 릴스 **실집행 완결 실적**(세금계산서 발행 + 5/3 게재) 존재.\n- 브랜드사가 5월 → 6월 **연속 발주(리텐션 거래)** — 단발 아님.\n- 5월 캠페인 조회수 10만+ 콘텐츠 다수(수치는 검증 필요).\n\n**출처:** Gmail threadId 19e20e83…(데패뉴 400만 세금계산서), 19eca704…(루솜 5월→6월 연속), 19daa204…(5/3 게재 보고)\n\n**[메모]** 실집행 '사실'은 강력한 근거. 단 **정량 성과수치(조회·전환·ROAS)는 미검증 게이트** → 수치 단정 금지. 실발주 브랜드 실명(셀바이오휴먼텍/루솜)도 동의 게이트 대상.\n\n---\n\n## ■ QA에 바로 쓸 만한 것 (안전·즉시 사용)\n\n1. **서비스 정의(섹션 1)** — 현재 공란 1순위 메움. \"직접 섭외보다 협력사 경유 협찬·스타일링 시딩·셀럽 블로그 SEO·IP 굿즈 시딩\" 모듈 설명.\n2. **디렉팅·운영 프로세스(섹션 4)** — 분단위 타임라인·동선·납품기준·소속사 컨펌 = '끝까지 곁에' 차별점. 비식별로 그대로 사용 가능.\n3. **계약·정산·초상권 정성 서술(섹션 5)** — \"3자 계약으로 권리범위·위약금·2차활용·선지급 리스크 관리\" (금액·실명 빼고).\n4. **현장 경호·안전 운영 포함(섹션 7)** — 사실만, 금액 빼고.\n5. **실집행 완결 + 리텐션 사실(섹션 9)** — 수치 빼고 '실제 집행·재발주' 정성 근거.\n6. **아웃리치 톤·협상 원칙(섹션 8)** — QA 답변 어휘·해요체 참고.\n\n## ■ 더 확인 필요 (팀 확정 / 추가 수집)\n\n1. **셀럽·소속사 실명 공개동의 목록** — 누구를 실명 노출 가능한지 팀 확정 필요. 현재 전부 비식별 전제.\n2. **PI 코퍼레이션 실체** — 확정 협력 엔터/에이전시인지, 단순 참고 리스트인지 출처·관계 불명. 셀럽 직접 섭외 채널의 실체 = 팀 확정.\n3. **단가 정책 정성 설명** — '비용 어떻게 책정?' 답변용(중개+협상 대행 구조) 표준 멘트 팀 확정. (단가 자체는 어차피 비노출)\n4. **캠페인 정량 성과** — 도달·조회·전환 결과보고서 미수집(PRD상 5/15~ 예정). 수치 QA화하려면 추가 수집·검증.\n5. **에스더버니 외 IP 사례** — 캐릭터 IP 협업은 사실상 에스더버니 단일 레퍼런스. '단일 사례' 전제로 작성 권장.\n6. **IP 라이선스 보유 주체·범위** — 에스더버니/틈결 라이선스 소유·비용·계약 범위 직접 명시 메일 미발견.\n7. **초상권·법적 리스크 입장** — 태초 미팅 구두 발언(\"제재 이력 없음·과감히 사용\") 수준뿐, 공식 가이드/약관 미발견 → QA에 **단정적 법적 표현 지양**.\n8. **5/3 게재 '첫 주인공' 실인물** — 데패뉴 게재 메일 풀텍스트 미열람, 릴리인지 타 셀럽인지 본문 확인 필요.\n\n---\n\n### 솔직한 자료 충실도 평가\n- **풍부:** 프로세스·서비스 정의·계약/운영 역량·캐스팅 풀 규모 (단일 캠페인 깊이 있게 실증됨).\n- **빈약/주의:** 정량 성과수치(미수집), IP 라이선스 구조(불명), 셀럽 직접섭외 채널 실체(PI 코퍼레이션 불명), 캐릭터 IP는 에스더버니 1건뿐. → **억지로 다(多)사례로 포장 금지.** 실증의 90%가 틈결×에스더버니 단일 출처임을 전제로 작성.","sources":["C:/Users/whwns/Desktop/SIRIAI/01. 영업/내방 미팅 회의록/태초 미팅.txt","C:/Users/whwns/Desktop/VIBE/SIRIAI/Company/_shared/V2/01_내용/건진_정보.md","C:/Users/whwns/Desktop/VIBE/SIRIAI/Company/DECK/_docs/QA_섹션_콘텐츠.md","C:/Users/whwns/Desktop/SIRIAI/02. 프로젝트/틈결/기획·PRD/에스더버니_메가인플루언서_개요_v3.docx","C:/Users/whwns/Desktop/SIRIAI/02. 프로젝트/틈결/기획·PRD/릴리_셀럽디렉팅_초안_v1.docx","C:/Users/whwns/Desktop/SIRIAI/04. 계약서/에스더버니/contract_review_internal.html","C:/Users/whwns/Desktop/SIRIAI/02. 프로젝트/틈결/기획·PRD/PRD_틈결x에스더버니_대시보드_v2.md","C:/Users/whwns/Desktop/SIRIAI/01. 영업/아웃바운드/방문형 (메가).txt","C:/Users/whwns/Desktop/SIRIAI/01. 영업/아웃바운드/PI 코퍼레이션 진행 연예인 리스트.txt","Gmail threadId 19d6bee14c08b92e (릴리 x 에스더버니)","Gmail threadId 19d958b129c1a102 (JYP 계약서)","Gmail threadId 19e20e83fa952f8a (데패뉴 세금계산서)","Gmail threadId 19eca704160f6ad2 (루솜 5월→6월 리텐션)","Gmail threadId 19db3471c2c2b315 (팀레드 경호)","Google Sheets id 1cb1TOjOCAsPjVDITL6Z53kIJo2CBzY8pFkT6He8ozn8 (통합 시트)","Google Sheets id 1skpzwQWFgsi4Q_ig13kMAdz_MIvnJQ0f (featuring_influencer)","Drive id 1thVWifcqiEw5IsamuWv-H5NCDadI5FV4 (메가 콘텐츠기획초안)","Drive id 1WUJdc-t5vRHk92gOeloj0RCSWRkdecIB (경호 견적서)"]},{"key":"해외 (글로벌)","md":"# 해외(글로벌) 영역 — QA 후보 정보 정리\n\n> 수집 출처: 구글 드라이브 시트, 로컬 영업 폴더, Gmail 스레드.\n> 표시 규칙(src/content.js 8행 명시): **단가 비노출 · 미검증 수치 금지 · 해외 '직접 운영' 표현 금지 · 브랜드 실명/로고는 공개동의 후**. 아래 단가·실명·수치는 전부 **내부 근거**이며, 외부 QA 노출 여부는 준용 결정 대상.\n\n---\n\n## 1. 글로벌 시딩 — 무엇을/어떻게 (프로세스·채널)\n\n**질문 후보**\n- \"글로벌 시딩은 어떻게 진행되나요?\"\n- 요?\"\n- \"콘텐츠를 광고로 다시 써도 되나요?\"\n\n**답에 들어갈 핵심**\n- 수앤캐롯츠 견적 구성: 크로스포스팅(틱톡·유튜브), ad 코드 전원 발급 약 20만, 어필리에이트 세팅 약 20만. Ad Code(인스타 레이블+틱톡 Spark) 관리비 옵션 2만원.\n- 틱톡 Spark Ads는 크리에이터 협상력으로 무상/저렴 협의 가능. 클린본 별도구매·선호도 하락 추세.\n- 2차활용 권리: 글로벌 시딩 IP 별도 구매 / 수앤캐롯츠·클로스무 무제한 / Soo House 견적 = 2차활용 무기한·광고저작권 1년·업로드 후 6개월 삭제불가.\n- 현실 단서: 인디·신생 브랜드는 어필리에이트가 로스 나는 경우 많아 **PPC(아마존 키워드 광고)가 더 나을 수 있음**.\n\n**출처**\n- 드라이브: 레이티드그린 vs 수앤캐롯츠(1zoGX9G5); SIRIAI_알루보_견적서(1z29I-25)\n- 로컬: `01. 영업/내방 미팅 회의록/[아마존 운영대행] 미팅.txt`\n- Gmail: 네이쳐리퍼블릭 Q&A(Spark Ads)\n\n**메모**\n- ⚠️ 단가 비노출. 통합 어필리에이트/스파크애즈 단가표 부재(산발 수치만).\n- 🔶 어필리에이트 답변에 \"인디는 PPC가 나을 수 있다\" 뉘앙스 추가 가능.\n\n---\n\n## 7. 아마존 운영대행\n\n**질문 후보**\n- \"아마존은 뭘 해주나요? 셋업비는요?\"\n\n**답에 들어갈 핵심**\n- 대상: 인디·신생 브랜드. 아마존 개설(브랜드·상품 등록), 상표권 등록(연계 변호사 2일 내 가능여부 회신, 브랜드 레지스트리 후 SIRIAI가 등록), 시핑 라벨부터 북미 전 준비.\n- 미디어 믹스: PPC 광고 + 틱톡 + 메타 광고. 셋업비 200만원.\n- 나노 시딩: 광고 직접 집행해 모집·필터링, 3만원 진행, 만족도 양호.\n- 아마존 FBA 운영 브랜드는 SIRIAI가 부운영자 권한으로 인플루언서 배송지 수집+FBA 발송 대행 가능(배송대행 서비스 자체는 미제공).\n\n**출처**\n- 로컬: `01. 영업/내방 미팅 회의록/[아마존 운영대행] 미팅.txt`\n- Gmail: 네이쳐리퍼블릭 Q&A(FBA 부운영자)\n\n**메모**\n- ✅ '아마존은 스터디 필요' 빈칸을 채울 1차 자료. 셋업 200만은 내부용.\n\n---\n\n## 8. 월마트 온라인 입점\n\n**질문 후보**\n- \"월마트 입점은 어떻게 하나요? 비용·기간은요?\"\n\n**답에 들어갈 핵심**\n- 후킹: 아마존 셀러 약 260만 vs 월마트 온라인 약 15만 → 선점 효과. 통상 입점요건(아마존 연매출 8만불+서류심사)이 아시아 담당(중국 오피스) 프로모션으로 면제·즉시 입점.\n- 계정구조: 에녹솔루션 인프라로 브랜드 명의 독립 헤드계정 신규 구축 후 에녹·SIRIAI를 매니저 권한 초대 → 자산권·정산 독립성 보장.\n- **8주 프로세스**: 1~2주 계정개설+브랜드레지스트리 / 3~4주 LQS 최적화·현지화·바자보이스 리뷰 동기화 / 5~6주 WFS(월마트 물류) 가입·초도입고·2-Day Shipping 뱃지 / 7~8주 Walmart Connect 광고+외부트래픽(틱톡/메타/시딩) 킥오프.\n- 예산: 월 200만원(2달 프로모션 특가), 최소 계약 3개월. 포함: 입점행정·WFS세팅·전상품 LQS 상세페이지·내부광고(PPC/CPC) 셋업·운영.\n\n**출처**\n- 로컬: `01. 영업/제안서·견적서/[바이뉴셀] 북미 월마트 온라인 마켓 입점 제안.txt`\n- 로컬: `01. 영업/내방 미팅 회의록/월마트 미팅.txt` (교차검증)\n\n**메모**\n- ✅ 제안서+미팅메모 **교차검증 완료**. '월마트는 스터디 필요' 빈칸 즉시 해소. 단가는 내부용.\n- 🔶 월마트 운영대행 구체 메일 근거는 없음(로컬 문서로만 확인).\n\n---\n\n## 9. 일본\n\n**질문 후보**\n- \"일본은 어떻게 진행되나요?\"\n\n**답에 들어갈 핵심**\n- 국내거주 일어권 활용: 수앤캐롯츠 일어권 UGC 4명 패키지 250만원(VAT포함). 알루보 건은 일본인 4명을 SIRIAI 자체 진행.\n- 클로스무가 일본 크리에이터 커버.\n- V3 deck 메모: 일본은 '공동작업자 전략'.\n\n**출처**\n- 드라이브: SIRIAI_알루보_견적서(1z29I-25); 알루보 실행사 비교(1efIzZQ)\n- Gmail: 수앤캐롯츠·클로스무 스레드\n\n**메모**\n- 🔶 **자료 빈약.** 일본 현지 직접 시딩 단독 프로세스/단가 문서 미발견. 국내거주 일어권 패키지와 deck 메모만 존재 → 카피 작성 필요.\n\n---\n\n## 10. 동남아\n\n**질문 후보**\n- \"동남아도 되나요?\"\n- \"해외 인플루언서를 국내로 부를 수 있나요?\"\n\n**답에 들어갈 핵심**\n- 시딩 기준 미국·동남아를 많이 진행. 필리핀 실집행 1건 확인(Cos de baha). 단가는 균일가 아님(1만 이하/1~3만), 모수 자체가 적음.\n- 해외→국내 초청: 메가·미국·필리핀은 계약서 쓰고 가능, 싱가폴 미정. 강릉에서 해외 유튜버 200명 진행 이력. 인하우스 마케터 직접소통도 적정 마크업으로 지원 가능.\n\n**출처**\n- 로컬: `01. 영업/내방 미팅 회의록/ID병원 해외팀 미팅.txt`\n- 드라이브: Cos de baha Philippines 시트\n\n**메모**\n- 🔶 **자료 빈약.** 필리핀 1건 외 베트남·태국·인도네시아 등 별도 단가·프로세스 문서 없음. '동남아 및 기타' 빈칸 카피 필요.\n\n---\n\n## 11. 중국\n\n**질문 후보**\n- \"중국은 어떤 채널/파트너로 진행되나요?\"\n\n**답에 들어갈 핵심**\n- 실행 파트너 **다퍼컴퍼니**를 통해 **샤오훙슈(小红书) + 도우인(douyin)** 중심 실행.\n- 레퍼런스: 샤오훙슈 9건, 도우인 30여 건 링크 보유.\n\n**출처**\n- 드라이브: 다퍼컴퍼니 샤오홍슈 레퍼런스 시트(1YiKOMSM)\n\n**메모**\n- 🔶 **단가·정산·프로세스 상세 문서 부재**(레퍼런스 링크 시트만). 메일 근거도 무매칭 → 중국 단가/정산은 QA 작성 시 준용 확인 필요.\n\n---\n\n## ■ QA에 바로 쓸 만한 것 (근거 충분)\n\n- **글로벌 시딩 프로세스/채널/무가·유가 차이** — 공식 카피 원천 확보, deck 이미 반영. (1·2번)\n- **아마존 운영대행 + 월마트 입점** — 8주 프로세스·월 200만·최소 3개월·WFS·LQS·FBA 대행까지. 제안서+미팅메모 교차검증. '스터디 필요' 빈칸을 통째로 해소. (7·8번)\n- **실행 파트너 매핑** — 북미=에녹솔루션, 중국=다퍼컴퍼니, 국내거주 외국인=수앤캐롯츠, 다국적/일본=클로스무. \"직접 운영\" 아닌 \"검증된 파트너망 협업\"으로. (3번)\n- **북미 실적·규모** — 102명 납품·200명(CJ ENM)·INNISFREE 3R 반복 등. 익명·권역 표기로. (4·5번)\n- **어필리에이트/2차활용 권리** — 2차활용 무기한·광고저작권 1년·인디 PPC 권장 뉘앙스. (6번)\n\n## ■ 더 확인 필요 (자료 빈약/민감)\n\n- **중국 단가·정산·프로세스 상세** — 레퍼런스 링크만, 단가/정산 문서·메일 근거 부재. (별도 채널 추정)\n- **동남아(필리핀 외)** — 베트남·태국·인도네시아 등 단가·프로세스 문서 없음. 실집행 필리핀 1건뿐.\n- **일본 현지 직접 시딩** — 국내거주 일어권 패키지·deck 메모만, 현지 직접 자료 미발견.\n- **어필리에이트/스파크애즈 통합 단가표** — 산발 수치(약 20만, 옵션 2만)만 존재.\n- **해외 정산 시점 통합 규정** — 채널별 상이(업로드기준/선불/월대행), 통합 기술 시 준용 결정 필요.\n- **에녹솔루션 정식 단가표·계약 원문** — 산발 수치(무가 3만, 셋업 200만)만.\n- **수앤캐롯츠·피아이 견적서 셀 단위 수치** — 링크만 있고 본문 미열람.\n\n## ⚠️ 표시 규칙 (외부 QA 노출 전 전수 적용)\n\n`src/content.js` 8행 명시: **단가 비노출 · 미검증 수치 금지 · 해외 '직접 운영' 표현 금지 · 브랜드 실명/로고는 공개동의 후 · 상투어/벤더 언어/이모지 금지.**\n→ 위 모든 단가·실명·수치는 **내부 근거 자료**. 외부 QA 본문은 단가 정성표현, 실명은 익명·권역, '직접 운영'은 '검증된 파트너망 협업'으로 순화. 노출 여부는 준용 결정 소관.","sources":["C:/Users/whwns/Desktop/VIBE/SIRIAI/Company/DECK/src/content.js (표시 규칙 8행 확인)","드라이브: 에녹솔루션_레이티드그린_SIRIAI_Global Seeding_USA_26년 (id 1j4DrElc)","드라이브: 실행사 후보군 (id 1gxEu5kx)","드라이브: 다퍼컴퍼니 샤오홍슈 레퍼런스 (id 1YiKOMSM)","드라이브: 레이티드그린 vs 수앤캐롯츠 (id 1zoGX9G5)","드라이브: SIRIAI_알루보_견적서 수앤캐롯츠 (id 1z29I-25)","드라이브: 알루보 캠페인 실행사 비교 (id 1efIzZQ)","드라이브: Global Seeding USA 실집행 시트 다수 (search_files)","로컬: C:/Users/whwns/Desktop/SIRIAI/01. 영업/제안서·견적서/[바이뉴셀] 북미 월마트 온라인 마켓 입점 제안.txt","로컬: C:/Users/whwns/Desktop/SIRIAI/01. 영업/내방 미팅 회의록/[아마존 운영대행] 미팅.txt","로컬: C:/Users/whwns/Desktop/SIRIAI/01. 영업/내방 미팅 회의록/월마트 미팅.txt","로컬: C:/Users/whwns/Desktop/SIRIAI/01. 영업/내방 미팅 회의록/ID병원 해외팀 미팅.txt","로컬: C:/Users/whwns/Desktop/VIBE/SIRIAI/Company/_shared/V2/01_내용/사업분야/02. visual contents/global seeding/global seeding.txt","Gmail: 에녹솔루션 인입 메일 (blackkast@enochsolution.com, 2026-04-16)","Gmail: 에녹솔루션 협업 미팅 요청 (jysiriai, 2026-05-11)","Gmail: 수앤캐롯츠 협업 정리 스레드 (kain@sooandcarrots.com, 2026-03-03)","Gmail: 클로스무 협업 스레드 (klosmumaster@gmail.com, 2026-03-04)","Gmail: 네이쳐리퍼블릭 글로벌 시딩 Q&A (김동현, 2025-12-09)","Gmail: 피아이코퍼레이션 북미 200명 스레드 (jeongin@picorp.co.kr, 2026-04-20)","Gmail: 뉴트리원 미국 틱톡샵 어필리에이트 미팅 Slack 알림 (2025-12-08)","Gmail: 마일드랩 북미 진출 프로세스 스레드 (jysiriai)","Gmail: SIRIAI 콜드/제안 공통 문구 (60개국 카피)"]},{"key":"브랜딩 비즈니스","md":"# 브랜딩 비즈니스 — QA 후보 정보 정리\n\n> 범위: 인플루언서 마케팅을 제외한 '브랜딩 비즈니스' 영역(모델/촬영/콘텐츠/라이브/디자인/웹·소개서). 수집원은 로컬·드라이브·Gmail 3종. 단가·실명·로고는 대부분 비노출/동의 게이트 대상이라 메모에 민감 표시.\n\n---\n\n## 1. 모델 스타일링 (모델 섭외·연출·촬영)\n\n**질문 후보**\n- \"모델 섭외도 해주시나요?\"\n- \"촬영까지 한 번에 맡길 수 있나요?\"\n\n**답에 들어갈 핵심**\n- 1~3단계 **모듈형** 선택: ① 모델 섭외만 ② 연출 기획만 ③ 촬영까지 일괄 위탁\n- 브랜드 상황에 맞게 부분/전체 자유 선택, **풀패키지 이용 시 할인** 적용\n- 가치제안: 모델 매칭·연출·촬영은 브랜드 내부 리소스·시간 소모가 큰 영역 → 이를 대행\n\n**출처**: 로컬 `…\\V2\\01_내용\\사업분야\\02. visual contents\\기타\\model styling\\model styling.txt` (원문 직접 확인됨)\n\n**메모**: 모듈 구조·풀패키지 할인은 **확정 사실**. 단, 구체 할인율·단가·보유 모델 풀(수)·섭외 경로는 **문서에 없음(미확정)**. 단가 비노출 방침 준수.\n\n---\n\n## 2. 브랜디드 콘텐츠 / 브랜드 인스타 운영\n\n**질문 후보**\n- \"제품 촬영·콘텐츠 제작도 하나요?\"\n- \"브랜드 인스타 운영을 맡길 수 있나요?\"\n\n**답에 들어갈 핵심**\n- 제품군: 신발·라이프스타일 소품·패션잡화·테크기기 등 실제품 중심 '이미지 표현력' 강화\n- 목적별 제작: 광고용 / 자사몰 썸네일 / SNS 업로드용\n- 단순 제품촬영이 아니라 **조명·연출·소품·촬영 스타일을 브랜드 콘셉트에 맞게** 풀어냄(촬영 기획 포함)\n- 인스타: 시즌무드·제품 사용맥락·키비주얼 연출 / 정적이미지+**AI 생성이미지+모션+숏폼 혼합**\n- **운영 방식**: 브랜드는 '제품이미지 + 콘셉트 가이드'만 전달 → 기획·디자인·납품 전담. **단발 또는 월간 정기 운영**\n\n**출처**: 로컬 `…\\02. visual contents\\기타\\브랜드 콘텐츠 제작\\브랜드 콘텐츠 제작.txt` (+ `인스타 콘텐츠 제작.txt`)\n\n**메모**: 서비스 범위·운영방식은 확정. **단가·납기(SLA) 수치는 미기재(미확정)**. 셀링포인트 = \"가이드만 주면 전담 + 월간운영 + AI/숏폼 혼합\".\n\n---\n\n## 3. 라이브커머스\n\n**질문 후보**\n- \"라이브커머스도 가능한가요?\"\n- \"촬영 스튜디오·쇼호스트는 어떻게 되나요?\"\n\n**답에 들어갈 핵심**\n- 라이브커머스 전문 제작사 **스튜디오 온일칠공(ON170)** 과 협력 — 촬영환경~쇼호스트 매칭~플랫폼 등록~배너/인서트 영상~홍보광고까지 **원스톱**\n- ON170 실적: **누적 3,500회 이상 방송 제작**(협력처 문서 기재값)\n- 연계 채널: 네이버·카카오·11번가·그립 등\n- 촬영방식 3종: 홈라이브 / 스튜디오라이브 / 출장라이브\n- 부가상품: 시청자 유입·바이럴·타게팅광고·채팅 서포터즈\n\n**출처**: 로컬 `…\\02. visual contents\\기타\\라이브 커머스\\라이브 커머스.txt`\n\n**메모**: 채널·촬영방식·부가상품 = 확정. \"3,500회+\"는 **협력처 문서 기재값(자체검증 아님 → 추정/인용 표기)**. ON170 실명·로고 노출은 **공개동의 게이트**.\n\n---\n\n## 4. 유튜브 캠페인\n\n**질문 후보**\n- \"유튜브 캠페인도 하나요?\"\n- \"비용 구조가 어떻게 되나요?\" (← 일부 답)\n\n**답에 들어갈 핵심**\n- 보유 크리에이터 소개식이 아니라, 캠페인 목적 청취 → 서칭 → 사전 커뮤니케이션 → 일정조율 → 메시지 정합성 확인까지 **시리아이 전담**\n- 데이터 기반 적합 인플루언서 선별, 저효율 크리에이터 제외\n- 콘텐츠 1건 단위 운영, 일정 금액 이상부터 별도 패키지\n- 과금: **진행비용 기준 15% 커미션**, 고정 단가 없이 예산 유연 조정\n\n**출처**: 로컬 `…\\02. visual contents\\기타\\Youtube campaign\\youtube campaign.txt` (원문 직접 확인됨)\n\n**메모**: 프로세스는 확정. **\"15% 커미션\"은 유일한 정량 과금 정보지만 단가 비노출 방침과 충돌** → QA 노출 여부는 **준용 결정 소관(민감)**.\n\n---\n\n## 5. 디자인 / 웹·랜딩페이지 제작 역량\n\n**질문 후보**\n- \"디자인은 누가 하나요? 실력은요?\"\n- \"랜딩페이지·홈페이지 제작도 가능한가요?\"\n\n**답에 들어갈 핵심 (협력 인력 역량 근거)**\n- 객원 리드 디자이너 **김바다(Bada Kim)** — 카카오엔터(브랜드 디자이너) → 프리랜서 리드 → 디파이(DFY) 주임 프로덕트 디자이너 이력\n- 주요 클라이언트 작업: **YG·삼성 웹사이트 기획/구축, 롯데온 커머스 리디자인, JINS(일본) 아이웨어 웹 리뉴얼, YG PLUS 팬덤커머스 'Buffz', 리쥬란·롯데온·JINS 리뉴얼**\n- 역량 풀스택: 서비스 전략 → BX(브랜드) → UX → UI → 디자인시스템/가이드라인\n- 지표 인용 가능: 테이블링 리뉴얼 **비핸스 좋아요 3,700+**\n- **자사 랜딩 제작 실증**: 토코보 캠페인 랜딩 실제 배포(`innovine-korea.vercel.app/tocobo/`), 포트폴리오 링크 `featpaper.com/v/7jqtPGf2`\n- 사내 분담(역량 보유 근거): 홈페이지=박팀장 / 인플루언서운영=황윤경 / PB=대표(김동현) / 사업소개서=조준용\n\n**출처**: 드라이브 `Bada Kim_Portfolio(UIUX).pdf` (fileId 1sUEwk…) / 로컬 `회사소개서.txt` / `…\\스터디\\콘텐츠_원천수집.md` / `토코보_DM.txt` + 토코보 랜딩 URL\n\n**메모 (중요·민감)**:\n- 김바다의 BX 실적(YG/롯데/JINS 등)은 **전 직장 것** → **\"시리아이 실적\"으로 직접 표기 불가**, \"협력 디자이너의 역량 근거\"로만 사용.\n- 김바다 **실명·직함 공개범위 미확정** (회사소개서엔 객원으로 거론, 공개 동의 게이트).\n- **토코보 캠페인 랜딩 = 자사가 실제 만든 랜딩 제작 실증**으로 가장 깔끔하게 인용 가능.\n\n---\n\n## 6. 팀 구성 / 협력 네트워크 / 오프라인 기획\n\n**질문 후보**\n- \"시리아이는 어떤 팀인가요?\"\n- \"협력하는 실행사·파트너는 어디인가요?\"\n- \"오프라인 행사도 기획하나요?\"\n\n**답에 들어갈 핵심**\n- 팀: **코어 5인 + 객원 멤버**(객원 디자이너 김바다 등)\n- 실행/협력 네트워크: 라이브커머스 **ON170**, K-pop 챌린지 파트너 **마루(MARU)**, 실행사 4곳(오초·인플루넷·에녹·마루), 에이전시 네트워크 8곳(SOV2R·SOONent·샌드박스·블라드·DMIL·크리플래닛·D&AD 등)\n- 오프라인 기획 실적: **틈결×에스더버니** — 3일 행사, VIP 130명+, 나노 100인, 매거진 7개 섭외, 브랜드 시딩 72명 (차별점5 중 '오프라인 기획력')\n- 틈결(웹매거진) = 진행이력 없던 프로젝트를 **기획·완수**한 사례 → '아키텍팅(기획·컨설팅)' 근거\n- 협업 실적 카피(자기소개): \"COSRX·MUSINSA STANDARD BEAUTY·ODDTYPE·8DIVISION·아이디병원 등 **500개 이상 브랜드** 협업\"\n\n**출처**: 로컬 `회사소개서.txt` / `…\\스터디\\콘텐츠_원천수집.md` / Gmail 박슬범 내부메모(threadId 19d621cd…)\n\n**메모 (민감)**: 협력처·브랜드 **실명/로고 공개동의 미확정** (특히 HYBE 계열·마루·에이전시 8곳). QA 노출 전 준용 확인. 오프라인 기획력·500개 브랜드 리스트는 차별점/실적 QA 자산.\n\n---\n\n## 7. 외주 실행 풀사이클 경험 (프로세스 근거용)\n\n**질문 후보**\n- \"외부 콘텐츠 제작·현장취재는 어떻게 진행되나요?\"\n\n**답에 들어갈 핵심**\n- 외부 미디어 파트너(데일리패션뉴스)를 기용한 **실제 집행 건** — 상품기획 → 견적 → 전자서명 계약 → **게재보고**까지 풀사이클 경험\n- 상품 예: 현장취재 릴스 + 스토리, 개런티(방문 셀럽 인당 최소 1건 바이럴 발행)\n\n**출처**: Gmail threadId 19daa2048ea04c7a (2026-04~05)\n\n**메모 (민감·제한적)**: 이는 셀럽 현장취재 **릴스 집행**(인플루언서 영역)이라 웹/소개서/사진/모델 단가 질문엔 부적합. **단가(400만원)는 발신측 대외비 요청 → QA·외부 노출 절대 금지.** '외주 기용+계약 풀사이클을 한다'는 프로세스 근거로만 제한 활용.\n\n---\n\n# ■ QA에 바로 쓸 만한 것 (사실 확정·인용 가능)\n\n1. **모델 스타일링 = 1~3단계 모듈형 + 풀패키지 할인** (원문 확인)\n2. **라이브커머스 = ON170 협력(3,500회+), 채널 4종·촬영방식 3종·부가상품** (3,500회는 협력처 기재값으로 인용 표기)\n3. **브랜드 인스타 = \"가이드만 주면 전담\" + 월간 정기운영 + AI/숏폼 혼합** (원문 확인)\n4. **디자이너 김바다 이력** (YG·삼성·카카오·롯데온·JINS / BX·UX·UI·디자인시스템 풀스택, 비핸스 3,700+) — 단, \"협력 인력 역량\"으로만, 자사 실적 아님\n5. **토코보 캠페인 랜딩 실제 배포** = 랜딩페이지 제작 실증(실물 URL), 포트폴리오는 featpaper 링크\n6. **오프라인 행사 기획 실적**(틈결×에스더버니: 3일·VIP 130명+·시딩 72명) + **500개+ 브랜드 협업** 카피\n7. **유튜브 = 시리아이 전담 프로세스**(과금 15%는 노출 여부 준용 결정 후)\n\n# ■ 더 확인 필요 (갭·미확정·민감)\n\n- **독립 상품화 미비**: '랜딩페이지 제작'·'사업소개서/회사소개서 제작'을 단가표·패키지·프로세스로 정리한 문서 없음. 현재 모두 `02.visual contents` 산하 부가서비스이고 별도 '브랜딩/웹제작' 서비스 폴더 부재(`01.architecture` 폴더는 비어 있음).\n- **포토그래퍼/사진 협력처**: 실명·단가·계약조건 미확인. 드라이브 `COMENT_코멘트 사진 소개서`(Google Slides, fileId 1LYFSoN…)는 **제목만 식별·본문 미정독** → 촬영 협력처 1차 후보, 정독 필요.\n- **모델 풀**: 보유 모델 수·섭외 경로·단가 미기재.\n- **단가/납기**: 브랜드콘텐츠·인스타·모델·라이브의 단가·SLA 수치 거의 없음. 정량 과금은 유튜브 15%(민감)뿐.\n- **자사 VI/BI 납품 케이스 미발견**: 김바다 BX 이력은 전 직장 것 → 시리아이 실적 직접 표기 불가.\n- **드라이브 심층 미탐색**: `000_세일즈용 링크 모음` / 포트폴리오 폴더 추가 실적·단가 가능성.\n- **Gmail 결론**: 인박스는 사실상 100% 인플루언서·셀럽 마케팅 → '브랜딩 비즈니스 외' 영역의 포트폴리오·단가·협력인력 1차 자료는 Gmail에 없음. 추가 자료는 Drive/로컬에 있을 가능성.\n- **공개동의 게이트(민감)**: 협력처·브랜드·디자이너 실명/로고 노출 전 준용 확인 필수.\n\n---\n\n### 솔직한 총평\n'브랜딩 비즈니스(인플루언서 외)'는 **독립 상품 라인이라기보다 `02.visual contents` 산하 부가 서비스군**(모델 스타일링·브랜드/인스타 콘텐츠·라이브커머스·유튜브)으로 존재. 웹/디자인 제작 역량은 **객원 디자이너 김바다 + 사내 분담**으로 충당. 부풀리지 않고 말하면, QA에 바로 쓸 확정 사실은 서비스 '구조/방식' 위주이고, **단가·실적 수치는 대부분 비어 있거나 노출 제한** 상태다.","sources":["C:\\Users\\whwns\\Desktop\\VIBE\\SIRIAI\\_shared\\V2\\01_내용\\사업분야\\02. visual contents\\기타\\model styling\\model styling.txt","C:\\Users\\whwns\\Desktop\\VIBE\\SIRIAI\\_shared\\V2\\01_내용\\사업분야\\02. visual contents\\기타\\Youtube campaign\\youtube campaign.txt","C:\\Users\\whwns\\Desktop\\VIBE\\SIRIAI\\_shared\\V2\\01_내용\\사업분야\\02. visual contents\\기타\\브랜드 콘텐츠 제작\\브랜드 콘텐츠 제작.txt","C:\\Users\\whwns\\Desktop\\VIBE\\SIRIAI\\_shared\\V2\\01_내용\\사업분야\\02. visual contents\\기타\\라이브 커머스\\라이브 커머스.txt","C:\\Users\\whwns\\Desktop\\V  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',+t.dataset.i===i));window.scrollTo(0,0);}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>render(+t.dataset.i));
render(0);
</script></body></html>
