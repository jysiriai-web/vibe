<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIRIAI 전체 인벤토리 — deck 선별용</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--bg:#fff;--off:#FAFAF8;--ink:#111;--sub:#666;--faint:#9a9a9a;--line:#E6E5E1;--ok:#1a7f4b;--okbg:#eaf6ef;--warn:#b4232a;--warnbg:#fbeced;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-weight:300;-webkit-font-smoothing:antialiased;}
  .top{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:18px 32px;display:flex;align-items:center;gap:18px;z-index:10;flex-wrap:wrap;}
  .top h1{font-size:1.05rem;font-weight:700;letter-spacing:-0.02em;}
  .top .sub{font-size:.78rem;color:var(--faint);font-weight:400;}
  .top .spacer{flex:1;}
  .cnt{font-size:.85rem;font-weight:600;background:var(--ink);color:#fff;padding:6px 14px;border-radius:20px;}
  .btn{font-size:.8rem;font-family:inherit;font-weight:500;padding:7px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--sub);transition:all .15s;}
  .btn:hover{border-color:var(--ink);color:var(--ink);}
  .btn.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .wrap{max-width:1080px;margin:0 auto;padding:36px 32px 120px;}
  .intro{background:var(--off);border:1px solid var(--line);border-radius:12px;padding:22px 26px;margin-bottom:40px;font-size:.92rem;color:var(--sub);word-break:keep-all;}
  .intro b{color:var(--ink);font-weight:600;}
  .cat{margin-bottom:50px;}
  .cat-h{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:8px;}
  .cat-h .cn{font-size:.75rem;color:var(--faint);font-weight:700;}
  .cat-h h2{font-size:1.25rem;font-weight:700;letter-spacing:-0.02em;}
  .cat-h .cd{margin-left:auto;font-size:.76rem;color:var(--faint);font-weight:400;}
  .item{display:flex;gap:14px;align-items:flex-start;padding:13px 14px;border-bottom:1px solid #f0efec;cursor:pointer;border-radius:8px;transition:background .12s;}
  .item:hover{background:var(--off);}
  .item.checked{background:var(--okbg);}
  .item input{margin-top:4px;width:17px;height:17px;flex-shrink:0;accent-color:#111;cursor:pointer;}
  .item .body{flex:1;}
  .item .t{font-size:1rem;font-weight:500;color:var(--ink);}
  .item .t .star{color:#c8a24a;font-weight:700;}
  .item .d{font-size:.84rem;color:var(--sub);font-weight:300;word-break:keep-all;margin-top:2px;}
  .item .tag{display:inline-block;font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:5px;font-weight:600;margin-left:7px;vertical-align:middle;}
  .tag.core{background:#111;color:#fff;}
  .tag.deal{background:#eef;color:#3a3a8a;}
  .tag.warn{background:var(--warnbg);color:var(--warn);}
  .tag.kpop{background:#fdeef5;color:#a83a6a;}
  #exportArea{display:none;margin-top:20px;}
  #exportArea textarea{width:100%;height:240px;font-family:'Pretendard',monospace;font-size:.82rem;padding:16px;border:1px solid var(--line);border-radius:10px;line-height:1.7;}
  .hint{font-size:.78rem;color:var(--faint);margin-top:6px;}
  @media(max-width:680px){.top{padding:14px 18px;}.wrap{padding:24px 18px 90px;}.cat-h .cd{display:none;}}
</style>
</head>
<body>
<div class="top">
  <div><h1>SIRIAI 전체 인벤토리</h1><div class="sub">deck에 넣을 것을 체크하세요 · 자동 저장됨</div></div>
  <div class="spacer"></div>
  <span class="cnt" id="cnt">선택 0</span>
  <button class="btn" id="filterBtn">선택만 보기</button>
  <button class="btn" id="exportBtn">선택 내보내기</button>
  <button class="btn" id="clearBtn">전체 해제</button>
</div>
<div class="wrap">
  <div class="intro">
    SIRIAI가 지금까지 진행한 <b>모든 것</b>을 카테고리별로 모았어요. 체크박스로 <b>deck에 넣을 것을 선별</b>하시면 — 선택은 브라우저에 자동 저장되고, <b>"선택 내보내기"</b>로 목록을 텍스트로 뽑아 제게 주시면 그걸로 deck을 짭니다. <span class="star" style="color:#c8a24a">★</span>=굵직한 것 / <span style="color:#a83a6a">K-POP</span>=엔터 / <span style="color:#3a3a8a">거래확인</span>=견적·정산 이력 있음.
    <div id="exportArea"><textarea id="exportText" readonly></textarea><div class="hint">위 텍스트를 복사해서 채팅에 붙여주세요.</div></div>
  </div>
  <div id="root"></div>
</div>
<script>
const DATA = [
  {cat:"A. Partners · 함께한 브랜드", cd:"deck Partners 후보 — 어디까지 노출할지", items:[
    {t:"무신사", d:"패션 플랫폼 · 거래명세서 이력", tag:"core"},
    {t:"카카오페이 × 삼성페이", d:"핀테크 협업", tag:"core"},
    {t:"HYBE 계열 아티스트", d:"ZB1·&TEAM·TXT·NCT WISH (마루 협업)", tag:"kpop"},
    {t:"CJ ENM / JYP", d:"엔터 (홈 로고 노출)", tag:"kpop"},
    {t:"이니스프리", d:"글로벌 시딩 USA", tag:"core"},
    {t:"COSRX", d:"글로벌 시딩 필리핀", tag:"core"},
    {t:"아이디병원 / 아이디성형외과", d:"의료 · 거래확인", tag:"deal"},
    {t:"이루람 (루솜·셀바이오휴먼텍)", d:"거래확인", tag:"deal"},
    {t:"레이티드그린 / 프리티액츄얼리 (알에이치앤비)", d:"글로벌 시딩 · 거래확인", tag:"deal"},
    {t:"잇퓨 (스킨케어)", d:"글로벌 시딩 USA · 거래확인", tag:"deal"},
    {t:"마루 (MARU)", d:"K-pop 챌린지 파트너 · 거래확인", tag:"deal"},
    {t:"키보 (P&CFirst) / 케미코스(다소다) / 이노바인 / MOEV", d:"뷰티 · 거래확인", tag:"deal"},
    {t:"오헤이오 / OJOS(오호스) / 쿼드세라(에코디엠랩) / toun28 / 크레모랩 / Dr.Bio", d:"뷰티·스킨 · 거래확인", tag:"deal"},
    {t:"스웨거(OOTD) / 키핀터치 / 나리스 / 르매리 / 아테나즈 / Lon.G", d:"패션·리빙 · 거래확인", tag:"deal"},
    {t:"투머치택스 / 토코보 / oddtype / 8division / 부산바다샌드 / 북블라", d:"라이프·F&B · 일부 거래", tag:"deal"},
    {t:"기타 거래 브랜드 다수", d:"그린컨티뉴·드림인사이트·케어드·안탈라·코마렉스·더에쓰씨·클코스·유니데카·핀브·어덴비·라라레서피·수아비나·클로디 등", tag:"deal"},
    {t:"대행/실행 파트너", d:"위드유·commalax·피아이·노이즈앤피치·야호엔터·시그니처레이블·직선기획·인플루넷", tag:""},
  ]},
  {cat:"B. 대표 케이스 · 실적", cd:"deck Proof 후보 — 익명화 수치로", items:[
    {t:"틈결 × 에스더버니 플래그십 (종합 캠페인)", d:"오프라인 3일 + 나노 100인 + 매거진 7 + 시딩 72 + 메가. 방문률 94.6%", tag:"core"},
    {t:"ZB1 일본 틱톡 챌린지", d:"글로벌 아티스트 댄스챌린지 36명·진행률 90%", tag:"kpop"},
    {t:"&TEAM MISMATCH / TXT / NCT WISH", d:"K-pop 글로벌 캠페인", tag:"kpop"},
    {t:"글로벌 시딩 (USA·필리핀)", d:"이니스프리·COSRX·Cos de baha — 영어권 정밀 섭외", tag:"deal"},
    {t:"하림 Thaifex (태국 박람회)", d:"해외 박람회 인플루언서", tag:"deal"},
    {t:"미국 틱톡 UGC (바이뉴셀 등)", d:"48건 후불제 캠페인", tag:""},
  ]},
  {cat:"C. 서비스 · 역량", cd:"deck Practices 후보", items:[
    {t:"아키텍팅 (기획·진단·컨설팅)", d:"페인포인트 진단 → 전략 설계", tag:""},
    {t:"AI 스코어링 (인스타 전체가 DB)", d:"가입자 풀이 아닌 전체에서 핏 발굴 · 20만 즉시 스코어링", tag:"core"},
    {t:"인플루언서 시딩 (국내/글로벌)", d:"무가/유가 · 한·일·미·동남아", tag:""},
    {t:"릴스·숏츠 / 글로벌 UGC (틱톡)", d:"콘텐츠 제작", tag:""},
    {t:"오프라인 행사 기획·운영", d:"VIP 초대·QR 체크인·현장 운영", tag:""},
    {t:"매거진·미디어 협업", d:"7개 매체 섭외 이력", tag:""},
    {t:"브랜드 시딩·체험단 / 후불제", d:"업로드분만 청구 = 리스크 0", tag:"core"},
    {t:"글로벌 물류 (Amazon MCF) / 2차 활용 보장", d:"해외 물류 원스톱", tag:""},
    {t:"샤오홍슈 (중국)", d:"위드유컴퍼니 협업", tag:""},
    {t:"sa:ai — 자체 AI 플랫폼", d:"Performance·Creative·Archivo", tag:"core"},
    {t:"Private Brand (PB)", d:"자체 브랜드 2026~ (기획 중)", tag:"warn"},
  ]},
  {cat:"D. 핵심 자산 · 수치", cd:"deck 신뢰·증거 요소", items:[
    {t:"프로세스 7단계", d:"계약→캠페인→리스트→컨펌→발송→업로드→보고서", tag:"core"},
    {t:"모집율 400% / 1.5배수 리스트", d:"정량 차별 근거", tag:"core"},
    {t:"방문률 94.6% (나노 191→87)", d:"운영 이행력", tag:"core"},
    {t:"나노 인플루언서 DB 191명+", d:"ER·오디언스·CPR 포함", tag:""},
    {t:"에이전시 네트워크 8곳", d:"SOV2R·SOONent·샌드박스·블라드·DMIL 등", tag:""},
    {t:"엔터 직접 컨택", d:"SM·JYP·HYBE·큐브", tag:"kpop"},
    {t:"마케팅 패키지 A~F", d:"메가/나노/시딩/행사/매거진/종합", tag:""},
    {t:"기술스택 (검증 필요)", d:"OpenAI·Anthropic·Gemini·Vercel·Supabase·Next.js", tag:"warn"},
  ]},
  {cat:"E. 회사 · 조직 · 브랜드", cd:"deck Studio·Manifesto 요소", items:[
    {t:"사명 知り合い (아는 사이/관계)", d:"브랜드 스토리의 축 — 시장과 브랜드를 잇는 지인", tag:"core"},
    {t:"\"분사한 기술팀\" 서사", d:"브랜드 운영하다 분사 → 페인포인트 이해", tag:"core"},
    {t:"CEO 김동현", d:"+ PB 기획 중", tag:""},
    {t:"박슬범 (운영/개인정보) · 조준용 (세일즈) · 황윤경 (인플루언서)", d:"R&R 코어", tag:""},
    {t:"회사 정보", d:"사업자 405-23-02027 · 서울 용산 · 070-7576-1944", tag:""},
    {t:"객원 (김바다 디자이너·실장님)", d:"Creative Partners", tag:""},
  ]},
  {cat:"F. 확인·결정 필요 (deck 전)", cd:"넣기 전 대표님 확인", items:[
    {t:"HYBE / K-pop 실명 공개 동의", d:"가장 강한 카드 — 동의 범위?", tag:"warn"},
    {t:"기술스택 실제 사용 검증", d:"OpenAI·Anthropic 진짜 쓰나? (홈 노출됨)", tag:"warn"},
    {t:"Seoul·SF·Tokyo 거점 실체", d:"홈 노출 — 실제 거점인가 야심인가", tag:"warn"},
    {t:"sa:ai 상세 (Figma)", d:"화면·기능 구체화", tag:"warn"},
    {t:"PB 기획안", d:"대표님 작성 중", tag:"warn"},
    {t:"단가 노출 범위", d:"비노출 방침 — FAQ로 우회 확정?", tag:"warn"},
  ]},
];

const root=document.getElementById('root');
let idCounter=0;
DATA.forEach((c,ci)=>{
  const cat=document.createElement('div');cat.className='cat';
  cat.innerHTML=`<div class="cat-h"><span class="cn">${String.fromCharCode(65+ci)}</span><h2>${c.cat.replace(/^[A-F]\. /,'')}</h2><span class="cd">${c.cd}</span></div>`;
  c.items.forEach(it=>{
    const id='it'+(idCounter++);
    const star = it.tag==='core' ? '<span class="star">★ </span>' : '';
    const tag = it.tag&&it.tag!=='core' ? `<span class="tag ${it.tag}">${it.tag==='deal'?'거래확인':it.tag==='warn'?'확인필요':it.tag==='kpop'?'K-POP':it.tag}</span>` : '';
    const lab=document.createElement('label');lab.className='item';lab.dataset.id=id;
    lab.innerHTML=`<input type="checkbox" data-id="${id}"><div class="body"><div class="t">${star}${it.t}${tag}</div><div class="d">${it.d}</div></div>`;
    cat.appendChild(lab);
  });
  root.appendChild(cat);
});

const KEY='siriai_inv_v1';
let saved=JSON.parse(localStorage.getItem(KEY)||'[]');
const boxes=[...document.querySelectorAll('input[type=checkbox]')];
function refresh(){
  const sel=boxes.filter(b=>b.checked);
  document.getElementById('cnt').textContent='선택 '+sel.length;
  boxes.forEach(b=>b.closest('.item').classList.toggle('checked',b.checked));
  localStorage.setItem(KEY,JSON.stringify(sel.map(b=>b.dataset.id)));
}
boxes.forEach(b=>{if(saved.includes(b.dataset.id))b.checked=true;b.addEventListener('change',refresh);});
refresh();

document.getElementById('filterBtn').addEventListener('click',e=>{
  const on=e.target.classList.toggle('on');
  document.querySelectorAll('.item').forEach(it=>{it.style.display=(on&&!it.querySelector('input').checked)?'none':'';});
  document.querySelectorAll('.cat').forEach(c=>{const any=[...c.querySelectorAll('.item')].some(i=>i.style.display!=='none');c.style.display=any?'':'none';});
});
document.getElementById('clearBtn').addEventListener('click',()=>{if(confirm('전체 해제할까요?')){boxes.forEach(b=>b.checked=false);refresh();}});
document.getElementById('exportBtn').addEventListener('click',()=>{
  const area=document.getElementById('exportArea'),ta=document.getElementById('exportText');
  let out='[ deck에 넣을 항목 — SIRIAI 인벤토리 선별 ]\n\n';
  DATA.forEach((c,ci)=>{
    const picks=[];
    let idx=0,base=0;for(let k=0;k<ci;k++)base+=DATA[k].items.length;
    c.items.forEach((it,i)=>{const b=boxes[base+i];if(b&&b.checked)picks.push('  - '+it.t);});
    if(picks.length){out+=c.cat+'\n'+picks.join('\n')+'\n\n';}
  });
  ta.value=out.trim()||'(아직 선택된 항목이 없어요)';
  document.getElementById('exportArea').style.display='block';
  ta.select();try{document.execCommand('copy');}catch(e){}
});
</script>
</body>
</html>
