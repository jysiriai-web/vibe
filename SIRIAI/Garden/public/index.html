<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Garden — 캠페인 대시보드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="side-brand"><span class="leaf">🌱</span> Garden</div>
      <nav class="nav">
        <button class="tab active" data-tab="recruit">
          <svg class="ni" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="lb">모집</span><span class="cnt" id="cnt-recruit">0</span>
        </button>
        <button class="tab" data-tab="upload">
          <svg class="ni" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span class="lb">업로드</span><span class="cnt" id="cnt-upload">0</span>
        </button>
        <button class="tab" data-tab="garden">
          <svg class="ni" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
          <span class="lb">가드닝</span><span class="cnt" id="cnt-garden">0</span>
        </button>
        <button class="tab" data-tab="deliver">
          <svg class="ni" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span class="lb">납품</span><span class="cnt" id="cnt-deliver">0</span>
        </button>
        <button class="tab" data-tab="settle">
          <svg class="ni" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span class="lb">정산</span>
        </button>
      </nav>
    </aside>

    <div class="mainwrap">
      <header class="topbar">
        <div class="topbar-title">
          <select id="campaignSelect" class="camp-select" title="캠페인 선택"></select>
        </div>
        <div class="topbar-right">
          <div class="stats">
            <div class="stat"><span class="k">잔액</span><span class="v" id="balance">—</span></div>
            <div class="stat"><span class="k">마지막 스캔</span><span class="v" id="scannedAt">—</span></div>
            <div class="stat"><span class="k">서비스</span><span class="v mono" id="service">—</span></div>
          </div>
          <button class="btn" id="contentScanBtn" title="아직 업로드 안 된 계정만 확인 (빠름). Shift+클릭 = 전체 재스캔(조회수 갱신)">업로드 스캔</button>
          <button class="btn primary" id="scanBtn" title="전체 계정 팔로워·닉네임 확인 (팔로워는 변동성 있어 매번 전체 스캔)">모집 스캔</button>
        </div>
      </header>

      <main id="content"></main>
    </div>
  </div>

  <div class="modal-bg" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">집행 확인</h2>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button class="btn" id="modalCancel">취소</button>
        <button class="btn danger" id="modalConfirm">집행 확정 (돈 나감)</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="overlay" id="overlay" role="status" aria-live="assertive" hidden><div class="spinner"></div><div id="overlayMsg">처리 중…</div></div>

  <script src="/app.js"></script>
</body>
</html>
