<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SIRIAI — 궁금한 것부터, 하나씩.</title>
<meta name="description" content="좋은 브랜드가 안 알려지는 건, 도달이 아니라 관계의 문제입니다. 궁금한 걸 눌러보세요." />
<script>document.documentElement.classList.add('js')</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@1,6..96,500;1,6..96,600&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  :root{
    --paper:#f3eee2; --surface:#fff; --ink:#211a33;
    --ink-2:rgba(33,26,51,.74); --ink-3:rgba(33,26,51,.58);
    --hair:rgba(33,26,51,.14); --hair-2:rgba(33,26,51,.26);
    --peach:rgba(246,201,168,.5); --lilac:rgba(221,208,239,.45); --cream:rgba(255,224,196,.4);
    --glass:rgba(255,255,255,.6);
    --shadow:0 16px 44px rgba(33,26,51,.13); --shadow-soft:0 8px 24px rgba(33,26,51,.08);
    --ease:cubic-bezier(.22,1,.36,1);
    --en:"Helvetica Neue","Arimo","Pretendard",system-ui,sans-serif;
    --kr:"Pretendard","Helvetica Neue","Arimo",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --serif:"Bodoni Moda",Georgia,serif;
    --edge:clamp(20px,5vw,48px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{font-family:var(--kr);color:var(--ink);line-height:1.62;font-size:16px;word-break:keep-all;
    -webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden;
    background:radial-gradient(60% 50% at 16% 6%,var(--peach),transparent 60%),radial-gradient(55% 45% at 88% 4%,var(--lilac),transparent 60%),var(--paper);
    background-attachment:fixed;}
  ::selection{background:var(--peach)}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  .label{font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:var(--ink-3)}
  .serif{font-family:var(--serif);font-style:italic;font-weight:500}
  .pill{display:inline-flex;align-items:center;gap:9px;font-family:var(--en);font-weight:600;font-size:15px;
    padding:14px 28px;border-radius:100px;background:var(--ink);color:var(--paper);
    transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
  .pill:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .pill.ghost{background:transparent;color:var(--ink);border:1px solid var(--hair-2)}
  .pill.ghost:hover{border-color:var(--ink)}
  .pill .arr{font-family:var(--serif);font-style:italic}

  .top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
    padding:16px var(--edge);backdrop-filter:blur(6px)}
  .top .mk{font-family:var(--en);font-weight:700;letter-spacing:.16em;font-size:14px}
  .top .jp{font-family:"Hiragino Sans","Noto Sans JP",var(--kr);font-size:12px;color:var(--ink-3)}

  .wrap{max-width:760px;margin:0 auto;padding:0 var(--edge) 140px}

  .head{padding:11vh 0 5vh;max-width:20ch}
  .head .eyebrow{display:block;margin-bottom:22px}
  .head h1{font-weight:600;font-size:clamp(28px,4.6vw,48px);line-height:1.16;letter-spacing:-.02em}
  .head h1 b{font-weight:600}
  .head p{margin-top:18px;color:var(--ink-2);font-size:clamp(15px,1.3vw,18px);max-width:32ch}

  .meta{display:flex;align-items:center;gap:14px;margin:8px 0 0}
  .meta .ln{flex:1;height:1px;background:var(--hair)}

  /* accordion */
  .qlist{border-bottom:1px solid var(--hair)}
  .qitem{border-top:1px solid var(--hair)}
  .qhead{display:flex;align-items:center;gap:18px;width:100%;text-align:left;padding:22px 4px}
  .qhead .n{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-3);flex:none;width:20px}
  .qhead .q{font-weight:600;font-size:clamp(16px,1.7vw,19px);letter-spacing:-.01em;line-height:1.34}
  .qhead .chev{margin-left:auto;flex:none;font-family:var(--en);font-weight:400;font-size:22px;color:var(--ink-3);
    line-height:1;transition:transform .35s var(--ease),color .2s}
  .qitem.open .qhead .chev{transform:rotate(45deg);color:var(--ink)}
  .qitem.open .qhead .q{color:var(--ink)}
  .qhead:hover .q{color:var(--ink)}

  .qpanel{overflow:hidden;transition:max-height .42s var(--ease),opacity .35s var(--ease);opacity:1}
  .js .qpanel{max-height:0;opacity:0}
  .qpanel-in{padding:0 4px 30px 54px}
  @media(max-width:560px){.qpanel-in{padding-left:4px}}
  .qpanel .a{font-size:15.5px;line-height:1.76;color:var(--ink)}

  .proof{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .stat{display:inline-flex;align-items:baseline;gap:7px;padding:8px 14px;border:1px solid var(--hair);border-radius:100px;background:var(--glass)}
  .stat .v{font-family:var(--en);font-weight:600;font-size:15px}
  .stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .brands{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .brand{padding:7px 14px;border:1px solid var(--hair);border-radius:100px;font-weight:600;font-size:13.5px;background:var(--glass)}
  .contrast{display:flex;gap:10px;margin-top:18px;max-width:460px}
  .cside{flex:1;border:1px solid var(--hair);border-radius:12px;padding:13px 14px;background:var(--glass)}
  .cside.a{opacity:.6}
  .cside .ct{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
  .cside .cv{font-size:13.5px;font-weight:500;line-height:1.4}
  .cvs{display:grid;place-items:center;font-family:var(--serif);font-style:italic;color:var(--ink-3)}
  .inlinecta{margin-top:20px}
  .inlinecta a{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--ink);
    border-bottom:1px solid var(--hair-2);padding-bottom:2px}
  .inlinecta a:hover{border-color:var(--ink)}
  .inlinecta .arr{font-family:var(--serif);font-style:italic}

  .followups{margin-top:24px}
  .followups .fl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:11px}
  .fchips{display:flex;flex-wrap:wrap;gap:8px}
  .fchip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--hair);border-radius:100px;
    background:var(--glass);font-weight:500;font-size:13.5px;transition:border-color .2s var(--ease),transform .2s var(--ease)}
  .fchip:hover{border-color:var(--hair-2);transform:translateY(-1px)}
  .fchip .go{font-family:var(--serif);font-style:italic;color:var(--ink-3)}

  /* contact card (몇 개 열면 등장) */
  .contact{margin-top:40px;border:1px solid var(--hair-2);border-radius:20px;padding:clamp(26px,4vw,40px);
    background:var(--glass);backdrop-filter:blur(14px);box-shadow:var(--shadow-soft);
    opacity:0;transform:translateY(16px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
  .contact.in{opacity:1;transform:none}
  .contact[hidden]{display:none}
  .contact .label{display:block;margin-bottom:14px}
  .contact h3{font-weight:600;font-size:clamp(20px,2.4vw,28px);letter-spacing:-.01em;line-height:1.3}
  .contact h3 .serif{font-weight:500}
  .contact p{margin-top:12px;color:var(--ink-2);font-size:15px;max-width:42ch}
  .contact .row{margin-top:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .contact .note{width:100%;color:var(--ink-3);font-size:13px;margin-top:6px}
  .contact .note a{border-bottom:1px solid var(--hair-2)}
  .contact .note a:hover{border-color:var(--ink)}

  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.qpanel,.chev,.contact{transition:none}.contact{opacity:1;transform:none}}

  html:not(.js) .nojs-hint{display:none}
</style>
</head>
<body>
<header class="top"><span class="mk">SIRIAI</span><span class="jp">知り合い</span></header>

<main class="wrap">
  <section class="head">
    <span class="label eyebrow">SIRIAI · 무엇이든 물어보세요</span>
    <h1 id="headline">SIRIAI가 <b>당신의</b> 고민을 해결해 드립니다.</h1>
    <p>좋은 브랜드가 안 알려지는 건, 도달이 아니라 <span class="serif">관계</span>의 문제니까요. 궁금한 걸 눌러보세요.</p>
  </section>

  <div class="meta"><span class="label">06 QUESTIONS</span><span class="ln"></span><span class="label nojs-hint">눌러서 펼치기</span></div>

  <div class="qlist" id="qlist"></div>

  <aside class="contact" id="contactCard" hidden>
    <span class="label">이제,</span>
    <h3>막힌 결정 <span class="serif">하나</span>만 가져와 주세요.</h3>
    <p>준비물은 없습니다. 목표부터 같이 풀어보시죠.</p>
    <div class="row">
      <a class="pill" href="mailto:jysiriai@gmail.com?subject=%5BSIRIAI%5D%20%ED%98%91%EC%97%85%20%EC%A0%9C%EC%95%88">협업 제안 보내기 <span class="arr">→</span></a>
      <span class="note">이메일이 부담되면 — <a href="https://open.kakao.com/o/sPb2dMfi" target="_blank" rel="noopener">오픈채팅으로 가볍게</a>.</span>
    </div>
  </aside>
</main>

<script>
(function(){
  var MAIL='mailto:jysiriai@gmail.com?subject=%5BSIRIAI%5D%20%ED%98%91%EC%97%85%20%EC%A0%9C%EC%95%88';
  var params=new URLSearchParams(location.search);
  var brand=(params.get('b')||params.get('brand')||'').trim();
  if(brand){ document.getElementById('headline').innerHTML='SIRIAI가 <b>'+esc(brand)+'의</b> 고민을 해결해 드립니다.'; }

  var QA={
    portfolio:{n:'01',q:'누구와 협업했나요?',
      a:'8division, 무신사, 이니스프리, 코스알엑스 등 다양한 브랜드와 함께해 왔고, 지금도 여러 브랜드와 진행 중입니다.',
      brands:['8division','무신사','이니스프리','코스알엑스'],
      cta:{label:'포트폴리오 확인하기',stub:true},follow:['ai','overseas']},
    ai:{n:'02',q:'AI로 인플루언서를 찾는다는 게 무슨 뜻이죠?',
      a:'가입자 풀에서 고르는 게 아니라, AI가 인스타그램 전체를 매번 새로 훑어 브랜드 결에 맞는 크리에이터를 발굴합니다. 그래서 캠페인마다 후보가 새로 올라옵니다.',
      contrast:['가입자 풀에서 고르기','결을 읽고, 발굴하기'],follow:['overseas','postpay']},
    overseas:{n:'03',q:'해외도 되나요?',
      a:'75개국·12개+ 플랫폼에서 현지 나노 인플루언서로 시딩합니다. 해외는 현지 파트너의 실행으로 진행해, 북미·중국까지 권역별로 좁혀 갑니다.',
      stats:[['75개국','커버리지'],['12+','플랫폼']],follow:['postpay','start']},
    postpay:{n:'04',q:'후불제가 뭐예요?',
      a:'착수금 20%로 시작하고, 실제 업로드된 분만 정산합니다. 안 올라오면 청구되지 않으니 리스크를 함께 집니다. 업로드율 100%로 유지해 온 방식입니다.',
      stats:[['100%','업로드율'],['20%','착수금']],follow:['start','portfolio']},
    start:{n:'05',q:'뭐부터 해야 할지 모르겠어요',
      a:'목표만 들려주시면 됩니다. 단순 마케팅이 아니라, 비어 있는 자리부터 같이 찾습니다. 3~4일 안에 첫 후보 리스트로 결과를 보여드려요.',
      follow:['about','postpay']},
    about:{n:'06',q:'SIRIAI가 뭐예요?',
      a:'좋은 브랜드를 시장과 ‘아는 사이’로 만드는 팀입니다. 감성과 기술을 같이 씁니다.',
      cta:{label:'아직 확신이 안 서면 — 홈페이지',stub:true},follow:['portfolio','ai']},
  };
  var ORDER=['portfolio','ai','overseas','postpay','start','about'];
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  var list=document.getElementById('qlist');
  list.innerHTML=ORDER.map(function(id){
    var x=QA[id], extra='';
    if(x.brands)extra+='<div class="brands">'+x.brands.map(function(b){return '<span class="brand">'+esc(b)+'</span>';}).join('')+'</div>';
    if(x.stats)extra+='<div class="proof">'+x.stats.map(function(s){return '<span class="stat"><span class="v">'+s[0]+'</span><span class="k">'+s[1]+'</span></span>';}).join('')+'</div>';
    if(x.contrast)extra+='<div class="contrast"><div class="cside a"><div class="ct">기존</div><div class="cv">'+esc(x.contrast[0])+'</div></div><div class="cvs">→</div><div class="cside"><div class="ct">SIRIAI</div><div class="cv">'+esc(x.contrast[1])+'</div></div></div>';
    if(x.cta)extra+='<div class="inlinecta"><a href="#" data-stub="1">'+esc(x.cta.label)+' <span class="arr">→</span></a></div>';
    var fch=(x.follow||[]).map(function(fid){return '<button class="fchip" data-open="'+fid+'"><span>'+esc(QA[fid].q)+'</span><span class="go">→</span></button>';}).join('');
    var follow=fch?'<div class="followups"><span class="fl">이어서 물어보기</span><div class="fchips">'+fch+'</div></div>':'';
    return '<div class="qitem" id="q-'+id+'" data-id="'+id+'">'+
      '<button class="qhead" data-open="'+id+'" aria-expanded="false"><span class="n">'+x.n+'</span><span class="q">'+esc(x.q)+'</span><span class="chev">+</span></button>'+
      '<div class="qpanel"><div class="qpanel-in"><p class="a">'+esc(x.a)+'</p>'+extra+follow+'</div></div>'+
    '</div>';
  }).join('');

  var opened={}, openedCount=0, contactShown=false;
  var contact=document.getElementById('contactCard');

  function setPanel(item,on){
    var panel=item.querySelector('.qpanel');
    if(on){ panel.style.maxHeight=panel.firstElementChild.scrollHeight+'px'; panel.style.opacity='1'; }
    else{ panel.style.maxHeight='0px'; panel.style.opacity='0'; }
  }
  function open(id,scroll){
    var item=document.getElementById('q-'+id); if(!item)return;
    if(!item.classList.contains('open')){
      item.classList.add('open');
      item.querySelector('.qhead').setAttribute('aria-expanded','true');
      setPanel(item,true);
      if(!opened[id]){ opened[id]=1; openedCount++; maybeContact(); }
    }
    if(scroll){ var y=item.getBoundingClientRect().top+window.pageYOffset-72; window.scrollTo({top:y,behavior:'smooth'}); }
  }
  function close(id){
    var item=document.getElementById('q-'+id); if(!item)return;
    item.classList.remove('open');
    item.querySelector('.qhead').setAttribute('aria-expanded','false');
    setPanel(item,false);
  }
  function toggle(id){
    var item=document.getElementById('q-'+id);
    if(item.classList.contains('open'))close(id); else open(id,false);
  }
  function maybeContact(){
    if(!contactShown && openedCount>=3){
      contactShown=true; contact.hidden=false;
      requestAnimationFrame(function(){ contact.classList.add('in'); });
      setTimeout(function(){ contact.scrollIntoView({behavior:'smooth',block:'center'}); },350);
    }
  }
  // 열린 패널 높이 재계산(폰트 로드/리사이즈 후)
  function recalc(){ document.querySelectorAll('.qitem.open').forEach(function(it){ setPanel(it,true); }); }
  window.addEventListener('resize',recalc);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(recalc);

  document.addEventListener('click',function(e){
    var stub=e.target.closest('[data-stub]'); if(stub){e.preventDefault();alert('데모: 실제로는 여기서 홈페이지/포트폴리오(deck)로 이동합니다.');return;}
    var head=e.target.closest('.qhead'); if(head){toggle(head.getAttribute('data-open'));return;}
    var fc=e.target.closest('.fchip'); if(fc){open(fc.getAttribute('data-open'),true);return;}
  });

  // 메일 딥링크: 로드 시 #postpay 등 있으면 그 답을 열고 스크롤
  function fromHash(){ var h=(location.hash||'').replace(/^#/,''); if(QA[h])open(h,true); }
  window.addEventListener('hashchange',fromHash);
  fromHash();
})();
</script>
</body>
</html>
