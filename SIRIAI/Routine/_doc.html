<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIRIAI · 문서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{--paper:#F3EEE2;--ink:#211A33;--soft:#5b5468;--line:rgba(33,26,51,.14);--card:#FBF8F1;--accent:#6B4DE6;
    --mono:'JetBrains Mono',monospace;--sans:'Pretendard','Helvetica Neue',sans-serif;}
  *{box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;margin:0;padding:32px 24px 80px}
  .wrap{max-width:820px;margin:0 auto}
  .top{display:flex;align-items:center;gap:14px;margin-bottom:24px}
  .home{font-size:13px;color:var(--accent);text-decoration:none;font-weight:500;padding:5px 11px;border:1px solid var(--line);border-radius:8px}
  .home:hover{background:#fff}
  .fname{font-family:var(--mono);font-size:12px;color:var(--soft)}
  .doc h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:28px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
  .doc h2{font-size:20px;font-weight:600;margin:28px 0 10px}
  .doc h3{font-size:16px;font-weight:600;margin:20px 0 8px}
  .doc p,.doc li{font-size:15px}
  .doc code{font-family:var(--mono);font-size:13px;background:rgba(33,26,51,.06);padding:1px 5px;border-radius:4px}
  .doc pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto}
  .doc pre code{background:none;padding:0}
  .doc table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14px}
  .doc th,.doc td{border:1px solid var(--line);padding:7px 11px;text-align:left}
  .doc th{background:var(--card)}
  .doc blockquote{border-left:3px solid var(--accent);margin:12px 0;padding:4px 16px;color:var(--soft)}
  .doc hr{border:none;border-top:1px solid var(--line);margin:24px 0}
  .doc a{color:var(--accent)}
  .err{color:#A32D2D;font-family:var(--mono);font-size:14px;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="대시보드.html" class="home">← 홈</a>
    <span class="fname" id="fname"></span>
  </div>
  <div class="doc" id="doc"><p style="color:var(--soft)">불러오는 중…</p></div>
</div>
<script>
const f = new URLSearchParams(location.search).get('f') || '';
document.getElementById('fname').textContent = f;
const url = '_docs/' + encodeURIComponent(f);
fetch(url).then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(md=>{ document.getElementById('doc').innerHTML = marked.parse(md); })
  .catch(e=>{ document.getElementById('doc').innerHTML =
    '<div class="err">문서를 못 불러왔습니다 ('+e.message+'). 파일: _docs/'+f+'</div>'; });
</script>
</body>
</html>
