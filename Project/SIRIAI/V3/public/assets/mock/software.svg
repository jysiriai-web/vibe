<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="소프트웨어 엔지니어링 비주얼(가상)">
  <defs>
    <linearGradient id="sw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f0e3"/>
      <stop offset="0.6" stop-color="#f3eee2"/>
      <stop offset="1" stop-color="#e9dfcd"/>
    </linearGradient>
    <radialGradient id="sg1" cx="0.8" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#ddd0ef" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ddd0ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sg2" cx="0.18" cy="0.82" r="0.55">
      <stop offset="0" stop-color="#ffe0c4" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffe0c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sw)"/>
  <rect width="800" height="600" fill="url(#sg1)"/>
  <rect width="800" height="600" fill="url(#sg2)"/>
  <!-- 노드 연결(관계 → 데이터 → 기록) -->
  <g stroke="#211a33" stroke-opacity="0.42" stroke-width="1.3">
    <line x1="180" y1="180" x2="400" y2="300"/>
    <line x1="180" y1="420" x2="400" y2="300"/>
    <line x1="400" y1="300" x2="620" y2="200"/>
    <line x1="400" y1="300" x2="620" y2="410"/>
    <line x1="180" y1="180" x2="180" y2="420"/>
    <line x1="620" y1="200" x2="620" y2="410"/>
  </g>
  <g fill="#211a33">
