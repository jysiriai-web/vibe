    <circle cx="180" cy="420" r="11" opacity="0.5"/>
    <circle cx="620" cy="200" r="11" opacity="0.5"/>
    <circle cx="620" cy="410" r="11" opacity="0.5"/>
    <!-- 중심 노드 강조 -->
    <circle cx="400" cy="300" r="17"/>
