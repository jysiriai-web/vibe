  <circle cx="400" cy="300" r="30" fill="none" stroke="#211a33" stroke-opacity="0.3" stroke-width="1.2"/>
  <!-- 라벨 알약 3(Performance·Creative·Archivo 암시) -->
  <g fill="#211a33" opacity="0.9">
