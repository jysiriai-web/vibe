<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIRIAI · 질문 UI 시안 갤러리</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#f3eee2;--surface:#fff;--ink:#211a33;--ink-2:rgba(33,26,51,.66);--ink-3:rgba(33,26,51,.40);
    --line:rgba(33,26,51,.13);--line-strong:rgba(33,26,51,.26);--cream:rgba(255,224,196,.55);--peach:rgba(246,201,168,.5);--lilac:rgba(221,208,239,.45);
    --kr:'Pretendard',system-ui,sans-serif;--en:'Helvetica Neue','Arimo',var(--kr);--mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--kr);color:var(--ink);line-height:1.55;
    background:radial-gradient(60% 50% at 14% 4%,var(--peach),transparent 60%),radial-gradient(55% 45% at 90% 2%,var(--lilac),transparent 60%),var(--paper);background-attachment:fixed;padding-bottom:60px}
  .wrap{max-width:1240px;margin:0 auto;padding:36px 26px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
  h1{font-size:clamp(24px,3vw,36px);font-weight:600;letter-spacing:-.02em;margin:8px 0 4px}
  .lead{color:var(--ink-2);font-size:14.5px;max-width:64ch}
  .pickbar{position:sticky;top:0;z-index:10;margin:18px 0 8px;padding:12px 16px;border:1px solid var(--line-strong);border-radius:14px;
    background:rgba(255,255,255,.8);backdrop-filter:blur(10px);display:flex;align-items:center;gap:14px;font-size:13.5px}
  .pickbar b{color:var(--ink)} .pickbar .none{color:var(--ink-3)}
  .pickbar .copy{margin-left:auto;font-family:var(--en);font-size:13px;padding:8px 16px;border-radius:100px;background:var(--ink);color:var(--paper);border:none;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;margin-top:14px}
  .card{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.45);overflow:hidden;display:flex;flex-direction:column}
  .card.chosen{border-color:var(--ink);box-shadow:0 18px 50px rgba(33,26,51,.14)}
  .card__h{padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
  .card__name{font-weight:600;font-size:15px} .card__eff{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:100px;padding:2px 8px}
  .card__one{padding:0 16px 12px;color:var(--ink-2);font-size:12.5px}
  .stage{height:240px;position:relative;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.1));overflow:hidden}
  .card__f{padding:11px 16px;display:flex;align-items:center;gap:10px}
  .pickbtn{font-family:var(--kr);font-size:13px;font-weight:500;padding:8px 16px;border-radius:100px;border:1px solid var(--line-strong);background:rgba(255,255,255,.6);color:var(--ink);cursor:pointer}
  .card.chosen .pickbtn{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .hint{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}

  /* ---- 공통 질문 칩/라인 ---- */
  .qline{font-family:var(--kr);font-size:14px;color:var(--ink-3);transition:color .4s,background .4s}
  .chip{display:inline-block;font-size:13px;color:var(--ink);background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:100px;padding:8px 15px;white-space:nowrap}

  /* 1. Spotlight */
  .sp{position:absolute;inset:0;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;gap:11px}
  .sp .qline{padding:6px 10px;border-radius:9px}
  .sp .qline.lit{color:var(--ink);background:var(--cream);font-weight:500}
  /* 2. Develop */
  .dv{position:absolute;inset:0;padding:18px 22px;display:flex;flex-direction:column;justify-content:center;gap:10px}
  .dv .row{display:flex;gap:12px;align-items:baseline;filter:blur(7px);opacity:.25;transition:filter .7s ease,opacity .7s ease}
  .dv .row.on{filter:blur(0);opacity:1}
  .dv .num{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
  .dv .q{font-size:13.5px;color:var(--ink)}
  /* 3. Thinking line */
  .tl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 24px;gap:12px}
  .tl__box{border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);padding:14px 16px;font-size:14.5px;color:var(--ink);min-height:50px}
  .tl__cur{display:inline-block;width:2px;height:1.05em;background:var(--ink);vertical-align:-.16em;margin-left:1px;animation:blink 1s steps(1) infinite}
  @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  .tl__sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
  /* 4. Stream */
  .st{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 24%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 24%,#000 72%,transparent)}
  .st .bub{position:absolute;left:22px;right:22px;font-size:13px;color:var(--ink);background:rgba(255,255,255,.66);border:1px solid var(--line);border-radius:13px;padding:9px 13px;will-change:transform,opacity}
  /* 5. Card deck */
  .ck{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .ck__card{position:absolute;width:74%;height:120px;border-radius:16px;border:1px solid var(--line);background:var(--surface);
    display:flex;align-items:center;justify-content:center;text-align:center;padding:0 22px;font-size:14px;font-weight:500;
    box-shadow:0 10px 30px rgba(33,26,51,.08);transition:transform .7s cubic-bezier(.22,1,.36,1),opacity .7s}
  /* 6. Compositor */
  .cp{position:absolute;inset:0;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;gap:12px}
  .cp .qline{color:var(--ink);font-size:14px;opacity:0;transition:opacity .8s,letter-spacing .8s}
  .cp .qline.set{opacity:1}
  /* 7. Revolver (현재) */
  .rv{position:absolute;inset:0;perspective:560px;-webkit-mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent)}
  .rv__stage{position:absolute;inset:0;transform-style:preserve-3d}
  .rv__chip{position:absolute;left:50%;top:50%;transform-origin:center;font-size:12.5px;color:var(--ink);background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:100px;padding:7px 14px;white-space:nowrap;will-change:transform,opacity}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">SIRIAI · UI Concept Gallery</p>
  <h1>질문 UI 시안 — 라이브 데모</h1>
  <p class="lead">각 카드가 <b>실제로 움직이는</b> 데모입니다. 같은 샘플 질문으로 비교해보고, 마음에 드는 시안의 <b>"이 시안으로"</b>를 누른 뒤 상단 <b>복사</b> → 채팅에 붙여넣어 주세요. 그걸로 덱의 질문 UI를 교체합니다. (여러 개 비교만 해도 됩니다.)</p>

  <div class="pickbar">
    <span id="pickLabel" class="none">아직 고른 시안이 없어요 — 카드의 "이 시안으로"를 눌러보세요.</span>
    <button class="copy" id="copyBtn">선택 복사</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
const Q = [
  '시리아이는 무엇이 다른가요?',
  '인플루언서 리스트는 어떻게 전달되나요?',
  '캠페인은 얼마나 걸리나요?',
  '해외 캠페인도 되나요?',
  'AI로 사람을 어떻게 고르나요?',
  '가격은 어떻게 되나요?',
];
const CONCEPTS = [
  {id:'spotlight',name:'여백의 호명',eff:'낮음',one:'빛(워시)이 한 줄씩 비추며 호명. 요소는 가만히, 움직이는 건 빛뿐.',init:initSpotlight},
  {id:'develop',name:'현상되는 인덱스',eff:'낮음',one:'암실 현상처럼 흐림→선명으로 떠오르는 mono 인덱스.',init:initDevelop},
  {id:'thinking',name:'생각 중인 커서',eff:'낮음',one:'AI가 골똘히 질문을 타이핑↔삭제하는 단일 입력 라인.',init:initThinking},
  {id:'stream',name:'대화의 강',eff:'중간',one:'질문 버블이 아래서 떠올라 위로 흐르는 채팅 스트림.',init:initStream},
  {id:'carddeck',name:'넘기는 색인지',eff:'중간',one:'종이 색인 카드가 한 장씩 떠오르며 넘어가는 덱(회전 없음).',init:initDeck},
  {id:'compositor',name:'활자 식자기',eff:'낮음',one:'활판 조판처럼 자간이 좁혀지며 한 줄씩 식자되는 타입.',init:initCompositor},
  {id:'revolver',name:'리볼버 (현재)',eff:'—',one:'지금 적용된 3D 회전 드럼 — 비교용.',init:initRevolver},
];

let chosen=null;
const grid=document.getElementById('grid');
CONCEPTS.forEach(c=>{
  const card=document.createElement('div');card.className='card';card.dataset.id=c.id;
  card.innerHTML=`<div class="card__h"><span class="card__name">${c.name}</span><span class="card__eff">난이도 ${c.eff}</span></div>
    <div class="card__one">${c.one}</div>
    <div class="stage" id="stage_${c.id}"></div>
    <div class="card__f"><button class="pickbtn">이 시안으로 →</button><span class="hint">클릭해 미리보기 상호작용</span></div>`;
  grid.appendChild(card);
  card.querySelector('.pickbtn').onclick=()=>{
    chosen=c;document.querySelectorAll('.card').forEach(x=>x.classList.remove('chosen'));card.classList.add('chosen');
    document.getElementById('pickLabel').innerHTML=`선택: <b>${c.name}</b> — 상단 "선택 복사" 후 채팅에 붙여넣어 주세요.`;
    document.getElementById('pickLabel').classList.remove('none');
  };
  setTimeout(()=>c.init(document.getElementById('stage_'+c.id)),60);
});
document.getElementById('copyBtn').onclick=async()=>{
  const t=chosen?`리볼버 대신 "${chosen.name}" 시안으로 질문 UI를 바꿔줘.`:'아직 시안을 안 골랐어요.';
  try{await navigator.clipboard.writeText(t);const b=document.getElementById('copyBtn');b.textContent='복사됨 ✓';setTimeout(()=>b.textContent='선택 복사',1400);}catch(e){alert(t)}
};

/* ============ 데모 구현 ============ */
function initSpotlight(s){
  s.innerHTML='<div class="sp"></div>';const box=s.querySelector('.sp');
  const items=Q.slice(0,5).map(q=>{const d=document.createElement('div');d.className='qline';d.textContent=q;box.appendChild(d);return d;});
  let i=0;const tick=()=>{items.forEach(x=>x.classList.remove('lit'));items[i].classList.add('lit');i=(i+1)%items.length;};tick();setInterval(tick,2000);
}
function initDevelop(s){
  s.innerHTML='<div class="dv"></div>';const box=s.querySelector('.dv');
  const rows=Q.slice(0,5).map((q,n)=>{const d=document.createElement('div');d.className='row';d.innerHTML=`<span class="num">0${n+1}</span><span class="q">${q}</span>`;box.appendChild(d);return d;});
  const develop=()=>{rows.forEach(r=>r.classList.remove('on'));rows.forEach((r,n)=>setTimeout(()=>r.classList.add('on'),200+n*180));};
  develop();setInterval(develop,5200);
}
function initThinking(s){
  s.innerHTML='<div class="tl"><div class="tl__box"><span class="tl__txt"></span><span class="tl__cur"></span></div><div class="tl__sub">또는 직접 물어보세요</div></div>';
  const el=s.querySelector('.tl__txt');let qi=0;
  const type=async()=>{const q=Q[qi%Q.length];for(let k=0;k<=q.length;k++){el.textContent=q.slice(0,k);await wait(55);}await wait(1100);
    for(let k=q.length;k>=0;k--){el.textContent=q.slice(0,k);await wait(28);}await wait(350);qi++;type();};type();
}
function initStream(s){
  s.innerHTML='<div class="st"></div>';const box=s.querySelector('.st');let qi=0;
  const spawn=()=>{const b=document.createElement('div');b.className='bub';b.textContent=Q[qi++%Q.length];box.appendChild(b);
    const H=s.clientHeight,dur=6500;let t0=null;
    const step=(t)=>{if(!t0)t0=t;const p=(t-t0)/dur;if(p>=1){b.remove();return;}
      b.style.transform=`translateY(${H-p*(H+60)}px)`;b.style.opacity=String(p<.2?p/.2:p>.8?(1-p)/.2:1);requestAnimationFrame(step);};
    requestAnimationFrame(step);};
  spawn();setInterval(spawn,1500);
}
function initDeck(s){
  s.innerHTML='<div class="ck"></div>';const box=s.querySelector('.ck');
  let order=Q.slice(0,5).map((q,i)=>{const d=document.createElement('div');d.className='ck__card';d.textContent=q;box.appendChild(d);return d;});
  const layout=()=>{order.forEach((c,i)=>{c.style.zIndex=String(50-i);c.style.opacity=i>2?'0':String(1-i*0.32);
    c.style.transform=`translateY(${i*10}px) scale(${1-i*0.05})`;});};
  layout();
  setInterval(()=>{const top=order[0];top.style.transform='translateY(-70px) scale(1.02)';top.style.opacity='0';
    setTimeout(()=>{order.push(order.shift());layout();},650);},2600);
}
function initCompositor(s){
  s.innerHTML='<div class="cp"></div>';const box=s.querySelector('.cp');
  const lines=Q.slice(0,5).map(q=>{const d=document.createElement('div');d.className='qline';d.textContent=q;d.style.letterSpacing='.28em';box.appendChild(d);return d;});
  const set=()=>{lines.forEach((l,n)=>{l.classList.remove('set');l.style.letterSpacing='.28em';
    setTimeout(()=>{l.classList.add('set');l.style.letterSpacing='-.01em';},180+n*220);});};
  set();setInterval(set,6000);
}
function initRevolver(s){
  s.innerHTML='<div class="rv"><div class="rv__stage"></div></div>';const stage=s.querySelector('.rv__stage');
  const list=Q.slice(0,6);const N=list.length,STEP=360/N,R=96,VIS=64;
  const chips=list.map(q=>{const b=document.createElement('div');b.className='rv__chip';b.textContent=q;stage.appendChild(b);return b;});
  let pos=0,last=performance.now();
  const tick=(now)=>{const dt=Math.min(now-last,64);last=now;pos=(pos+dt/2600)%N;
    chips.forEach((el,i)=>{let a=((i-pos)*STEP%360+360)%360;if(a>180)a-=360;const ab=Math.abs(a);const front=ab<=VIS;
      el.style.transform=`translate(-50%,-50%) rotateX(${a}deg) translateZ(${R}px)`;el.style.opacity=front?String(Math.max(.16,1-ab/92)):'0';});
    requestAnimationFrame(tick);};requestAnimationFrame(tick);
}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
</script>
</body>
</html>
