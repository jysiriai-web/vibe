<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- ▼ 메타/OG 태그는 applyBrand()에서 BRAND.meta·BRAND.share 기준으로 런타임 주입됩니다 -->
    <title>SIRIAI Proposal</title>
    <meta name="description" content="">
    <meta property="og:type" content="website">
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta property="og:image" content="">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- SIRIAI 브랜드 폰트: Pretendard(국문) · Arimo(헬베티카 대체) · JetBrains Mono(라벨) · Bodoni Moda(에디토리얼 악센트) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
    /* ════════════════════════════════════════════════════════════════
       1. DESIGN TOKENS  (색·폰트는 applyBrand가 :root에 런타임 주입)
       ════════════════════════════════════════════════════════════════ */
    :root {
        /* ── SIRIAI 브랜드 코어 (고정 하우스 스타일) ── */
        --paper: #F3EEE2;                  /* 기본 배경: 따뜻한 크림 종이 */
        --ink: #211A33;                    /* 기본 텍스트 · CTA */
        --ink-2: rgba(33,26,51,.66);
        --ink-3: rgba(33,26,51,.46);
        --line: rgba(33,26,51,.13);
        --line-2: rgba(33,26,51,.24);
        --accent-blue: #2A6FDB;            /* 텍스트 링크 전용, 극히 드물게 */
        /* 웜 워시 글로우 — 색감은 여기서 나온다 */
        --wash-peach: rgba(246,201,168,.5);
        --wash-lilac: rgba(221,208,239,.45);
        --wash-cream: rgba(255,224,196,.42);
        --glass: rgba(255,255,255,.55);

        /* ── 컴포넌트 매핑 (변수명 유지 → 엔진/컴포넌트 호환) ── */
        --brand-primary: var(--ink);
        --brand-primary-deep: #16111F;
        --brand-accent: #B27B53;           /* 절제된 웜 클레이 악센트 (config가 덮음) */
        --brand-accent-soft: #C9A07B;
        --bg: var(--paper);
        --surface: #FBF8F1;                /* 따뜻한 카드 면 (순백 금지) */
        --surface-2: #ECE5D6;
        --border: var(--line);
        --img-placeholder: #E7DFCF;
        --text-main: var(--ink);
        --text-sub: var(--ink-2);
        --on-accent: var(--paper);         /* 잉크 알약 위 텍스트 = 종이색 */

        /* Semantic status (잉크 기반 절제 팔레트) */
        --st-done: #2E7D58;  --st-done-bg: rgba(46,125,88,.10);
        --st-pend: #B0791F;  --st-pend-bg: rgba(176,121,31,.10);
        --st-warn: #B03B3B;  --st-warn-bg: rgba(176,59,59,.10);
        --st-info: #2C5F9E;  --st-info-bg: rgba(44,95,158,.10);

        /* Elevation (부드러운 그림자) */
        --shadow-sm: 0 10px 30px rgba(33,26,51,.06);
        --shadow-md: 0 16px 44px rgba(33,26,51,.13);
        --shadow-lg: 0 30px 60px rgba(33,26,51,.16);

        /* Geometry / motion */
        --radius-card: 18px;
        --radius-sm: 12px;
        --radius-pill: 100px;
        --nav-height: 76px;
        --ease-out: cubic-bezier(.16,1,.3,1);

        /* Fonts (SIRIAI 5종 고정) */
        --font-display: 'Helvetica Neue','Helvetica','Arimo','Pretendard',Arial,sans-serif;
        --font-body: 'Pretendard', system-ui, sans-serif;
        --font-num: 'Helvetica Neue','Helvetica','Arimo','Pretendard',sans-serif;
        --font-label: 'JetBrains Mono', ui-monospace, monospace;
        --font-editorial: 'Bodoni Moda', Georgia, serif;
    }

    ::selection { background: var(--ink); color: var(--paper); }

    /* ════════════════════════════════════════════════════════════════
       2. BASE
       ════════════════════════════════════════════════════════════════ */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    body {
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--text-main);
        overflow: hidden;
    }
    .serif { font-family: var(--font-display); font-optical-sizing: auto; }
    .num   { font-family: var(--font-num); font-feature-settings: 'tnum' 1; }
    a { color: inherit; }

    /* 키보드 포커스 가시화 (접근성) */
    :focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 2px; border-radius: 4px; }
    .nav-btn:focus-visible, .btn:focus-visible, .tool-btn:focus-visible { outline-offset: 3px; }

    /* 모션 최소화 선호 사용자 대응 */
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
        .fade-up { opacity: 1 !important; transform: none !important; }
    }

    #app { width: 100vw; height: 100vh; position: relative; }

    /* ──────── slide shell ──────── */
    .slide {
        position: absolute; inset: 0;
        padding: 34px 40px 100px;
        opacity: 0; pointer-events: none;
        transition: opacity .6s ease;
        display: flex; flex-direction: column; align-items: center;
        overflow-y: auto; overflow-x: hidden;
    }
    .slide.active { opacity: 1; pointer-events: auto; z-index: 10; }
    .container { width: 100%; max-width: 1200px; margin: auto 0; }
    .center { text-align: center; }

    /* ──────── entrance animation ──────── */
    .fade-up { opacity: 0; transform: translateY(28px); transition: opacity .9s ease, transform .9s ease; }
    .slide.active .fade-up { opacity: 1; transform: translateY(0); }
    .d1 { transition-delay: .10s; } .d2 { transition-delay: .20s; }
    .d3 { transition-delay: .30s; } .d4 { transition-delay: .40s; }

    /* ──────── typography helpers ──────── */
    .eyebrow {
        font-family: var(--font-label); font-size: 11px; font-weight: 500;
        letter-spacing: .2em; text-transform: uppercase; color: var(--brand-accent);
        margin-bottom: 16px;
    }
    .slide-title {
        font-family: var(--font-display); font-weight: 600;
        font-size: clamp(32px, 4vw, 58px); letter-spacing: -.02em;
        color: var(--text-main); margin-bottom: 14px; word-break: keep-all;
    }
    .slide-sub { font-size: clamp(14px,1.1vw,17px); color: var(--text-sub); margin-bottom: 44px; word-break: keep-all; }
    .divider { width: 48px; height: 1px; background: var(--ink-3); }

    /* ════════════════════════════════════════════════════════════════
       3. TOOLBAR (PDF / 테마 / 모드) — 화면에만, 인쇄 시 숨김
       ════════════════════════════════════════════════════════════════ */
    .toolbar {
        position: fixed; top: 16px; right: 18px; z-index: 150;
        display: flex; gap: 8px; align-items: center;
    }
    .tool-btn {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--surface); color: var(--text-sub);
        border: 1px solid var(--border); border-radius: var(--radius-pill);
        padding: 7px 13px; font-family: var(--font-body); font-size: 12.5px; font-weight: 500;
        cursor: pointer; transition: all .25s; white-space: nowrap;
        box-shadow: var(--shadow-sm);
    }
    .tool-btn:hover { color: var(--brand-primary); border-color: var(--brand-accent); }
    .tool-btn svg { width: 15px; height: 15px; }
    .mode-tag {
        font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
        padding: 5px 10px; border-radius: var(--radius-pill);
        background: var(--st-warn-bg); color: var(--st-warn);
    }
    .mode-tag.public { background: var(--st-done-bg); color: var(--st-done); }

    /* ════════════════════════════════════════════════════════════════
       4. BOTTOM NAV
       ════════════════════════════════════════════════════════════════ */
    .bottom-nav {
        position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height);
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border-top: 1px solid var(--border);
        display: flex; justify-content: center; align-items: center; gap: 8px;
        z-index: 100; padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-brand {
        position: absolute; left: 28px; top: 50%; transform: translateY(-50%);
        display: flex; align-items: center; gap: 9px; opacity: .9;
        font-family: var(--font-display); font-size: 15px; font-weight: 500; letter-spacing: .02em;
    }
    .nav-brand .x { font-size: 11px; color: var(--text-sub); font-family: var(--font-body); font-weight: 600; letter-spacing: .1em; }
    .nav-btn {
        background: none; border: none; font-family: var(--font-body);
        font-size: clamp(12.5px,.95vw,15px); font-weight: 500; color: var(--text-sub);
        cursor: pointer; padding: 9px 18px; border-radius: var(--radius-pill); transition: all .3s; white-space: nowrap;
    }
    .nav-btn.active, .nav-btn:hover { color: var(--on-accent); background: var(--brand-primary); }
    [data-theme='dark'] .nav-btn.active, [data-theme='dark'] .nav-btn:hover { color: #0C0C0C; background: var(--brand-accent); }

    /* ════════════════════════════════════════════════════════════════
       5. COVER
       ════════════════════════════════════════════════════════════════ */
    .cover-slide {
        background:
          radial-gradient(58% 50% at 15% 6%, var(--wash-peach), transparent 60%),
          radial-gradient(48% 44% at 90% 16%, var(--wash-lilac), transparent 62%),
          radial-gradient(74% 60% at 62% 104%, var(--wash-cream), transparent 60%),
          var(--paper);
        color: var(--ink);
    }
    .cover-layout { display: grid; grid-template-columns: 1.08fr .92fr; gap: 60px; align-items: center; }
    .cover-text { display: flex; flex-direction: column; }
    .cover-eyebrow { font-family: var(--font-label); font-size: 11px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--brand-accent); margin-bottom: 22px; }
    .cover-wordmark { font-family: var(--font-display); font-size: clamp(48px,6vw,84px); font-weight: 600; line-height: .98; letter-spacing: -.028em; color: var(--ink); }
    .cover-wordmark img { width: clamp(260px,30vw,420px); height: auto; }
    .cover-cross { font-family: var(--font-display); font-size: clamp(22px,2.4vw,36px); font-weight: 400; color: var(--ink-2); margin-top: 10px; letter-spacing: -.01em; }
    .cover-cross span { color: var(--brand-accent); }
    .cover-divider { width: 48px; height: 1px; background: var(--ink-3); margin: 24px 0; }
    .cover-tagline { font-family: var(--font-editorial); font-size: clamp(18px,1.6vw,27px); font-style: italic; font-weight: 500; color: var(--ink-2); line-height: 1.4; margin-bottom: 26px; word-break: keep-all; }
    .cover-badges { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
    .cover-badge { font-family: var(--font-label); background: transparent; border: 1px solid var(--line-2); color: var(--ink-2); padding: 8px 16px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
    .cover-desc { font-size: 14px; color: var(--ink-3); font-weight: 400; line-height: 1.7; }
    .cover-figure { position: relative; border-radius: var(--radius-card); overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow-md); aspect-ratio: 4/5; max-height: 76vh; }
    .cover-figure img { width: 100%; height: 100%; object-fit: cover; }
    .cover-figure .placeholder {
        width: 100%; height: 100%;
        background:
          radial-gradient(72% 56% at 26% 20%, var(--wash-peach), transparent 60%),
          radial-gradient(60% 50% at 82% 82%, var(--wash-lilac), transparent 62%),
          var(--surface-2);
        display: flex; align-items: center; justify-content: center;
    }
    .cover-figure .placeholder span { font-family: var(--font-editorial); font-style: italic; font-size: 24px; color: var(--ink-3); }
    .cover-figure::after {
        content: attr(data-caption); position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
        font-family: var(--font-label); font-size: 10px; font-weight: 500; letter-spacing: .26em; color: var(--ink-2);
        white-space: nowrap;
    }
    .sample-flag {
        position: absolute; top: 26px; left: 40px; z-index: 20;
        font-family: var(--font-label); font-size: 10px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
        color: var(--ink-2); border: 1px solid var(--line-2); padding: 5px 12px; border-radius: var(--radius-pill);
    }

    /* ════════════════════════════════════════════════════════════════
       6. FEATURE CARDS
       ════════════════════════════════════════════════════════════════ */
    .feature-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 22px; }
    .feature-card {
        text-align: left; padding: 30px 26px; background: var(--surface);
        border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-sm);
        transition: transform .4s, box-shadow .4s, border-color .4s;
    }
    .feature-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-md); border-color: var(--line-2); }
    .feature-icon { width: 46px; height: 46px; border-radius: 50%; background: color-mix(in srgb, var(--ink) 6%, transparent); border: 1px solid var(--line); color: var(--ink); display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
    .feature-icon svg { width: 20px; height: 20px; }
    .feature-no { font-family: var(--font-label); font-size: clamp(14px,1.2vw,18px); color: var(--brand-accent); font-weight: 500; letter-spacing: .1em; margin-bottom: 12px; }
    .feature-title { font-size: clamp(16px,1.4vw,21px); font-weight: 700; margin-bottom: 10px; word-break: keep-all; }
    .feature-desc { font-size: clamp(13px,1.02vw,15.5px); color: var(--text-sub); line-height: 1.7; word-break: keep-all; }

    /* ════════════════════════════════════════════════════════════════
       7. COMPARE BAR (ER)
       ════════════════════════════════════════════════════════════════ */
    .compare { width: 100%; max-width: 640px; margin: 0 auto 22px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-sm); padding: 16px 24px; }
    .compare-label { font-size: 13px; font-weight: 700; color: var(--text-sub); margin-bottom: 16px; text-align: left; }
    .compare-row { display: flex; align-items: center; margin-bottom: 13px; }
    .compare-row:last-child { margin-bottom: 0; }
    .compare-name { width: 150px; font-size: 13px; color: var(--text-sub); text-align: left; line-height: 1.3; }
    .compare-row.ours .compare-name { font-weight: 700; color: var(--text-main); }
    .compare-track { flex-grow: 1; background: var(--surface-2); height: 12px; border-radius: 6px; overflow: hidden; }
    .compare-fill { width: 0; height: 100%; background: var(--border); border-radius: 6px; transition: width 1.4s cubic-bezier(.2,.8,.2,1); }
    .compare-row.ours .compare-fill { background: var(--brand-primary); transition-delay: .25s; }
    [data-theme='dark'] .compare-row.ours .compare-fill { background: var(--brand-accent); }
    .compare-val { width: 64px; font-size: 13px; color: var(--text-sub); text-align: right; font-weight: 600; }
    .compare-row.ours .compare-val { font-size: 16px; color: var(--brand-accent); font-weight: 700; }

    /* ════════════════════════════════════════════════════════════════
       8. CURATION CARDS
       ════════════════════════════════════════════════════════════════ */
    .curation-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 22px; width: 100%; margin-bottom: 26px; }
    .cur-card { transition: transform .3s; }
    .cur-card:hover { transform: translateY(-5px); }
    .cur-avatar { width: 100%; aspect-ratio: 1; border-radius: 6px; margin-bottom: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--img-placeholder); }
    .cur-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .cur-avatar .ini { font-family: var(--font-display); font-size: 30px; color: #fff; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .cur-name { font-size: clamp(15px,1.3vw,20px); font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .cur-link { color: var(--text-sub); text-decoration: none; font-size: 15px; transition: color .2s; }
    .cur-link:hover { color: var(--brand-accent); }
    .cur-stat { font-size: clamp(12.5px,1vw,14px); color: var(--text-sub); margin-bottom: 3px; }

    /* ════════════════════════════════════════════════════════════════
       9. BUTTONS
       ════════════════════════════════════════════════════════════════ */
    .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--brand-primary); color: var(--on-accent); border: none; padding: 13px 34px; border-radius: var(--radius-pill); font-family: var(--font-body); font-size: 14.5px; font-weight: 500; cursor: pointer; transition: transform .2s, box-shadow .3s; }
    [data-theme='dark'] .btn { background: var(--brand-accent); color: #0C0C0C; }
    .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-sub); }
    .btn-ghost:hover { color: var(--text-main); border-color: var(--brand-accent); }
    .note { font-size: 12px; color: var(--text-sub); margin-top: 14px; word-break: keep-all; }

    /* ════════════════════════════════════════════════════════════════
       10. REFERENCE STRIP
       ════════════════════════════════════════════════════════════════ */
    .ref-strip { width: 100%; margin-top: 16px; padding: 15px 26px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); display: flex; justify-content: space-between; align-items: center; gap: 16px; box-shadow: var(--shadow-sm); flex-wrap: wrap; }
    .ref-info { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .ref-badge { font-family: var(--font-label); background: var(--ink); color: var(--paper); padding: 6px 13px; border-radius: var(--radius-pill); font-size: 10px; font-weight: 500; letter-spacing: .1em; white-space: nowrap; }
    .ref-items { font-size: 14px; color: var(--ink-2); }
    .ref-items strong { color: var(--ink); font-weight: 700; }
    .ref-cta { color: var(--ink); text-decoration: none; font-weight: 600; font-size: 13.5px; border: 1px solid var(--line-2); padding: 9px 18px; border-radius: var(--radius-pill); transition: all .3s; white-space: nowrap; }
    .ref-cta:hover { background: var(--ink); color: var(--paper); }

    /* ════════════════════════════════════════════════════════════════
       11. SIMULATOR
       ════════════════════════════════════════════════════════════════ */
    .sim { width: 100%; margin-top: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-sm); padding: 16px 28px; text-align: left; }
    .sim-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
    .sim-eyebrow { font-family: var(--font-label); font-size: 11px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--brand-accent); margin-bottom: 4px; }
    .sim-title { font-size: 18px; font-weight: 700; }
    .sim-budget { font-family: var(--font-num); font-size: 24px; font-weight: 500; color: var(--text-main); }
    .sim-slider { width: 100%; margin-bottom: 16px; accent-color: var(--brand-primary); cursor: pointer; }
    [data-theme='dark'] .sim-slider { accent-color: var(--brand-accent); }
    .sim-metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
    .sim-cell { background: var(--surface-2); padding: 15px 12px; border-radius: 8px; text-align: center; }
    .sim-cell.hl { background: var(--brand-primary); }
    [data-theme='dark'] .sim-cell.hl { background: var(--surface-2); border: 1px solid var(--brand-accent); }
    .sim-cell .k { font-size: 12px; color: var(--text-sub); margin-bottom: 8px; }
    .sim-cell.hl .k { color: rgba(255,255,255,.75); }
    [data-theme='dark'] .sim-cell.hl .k { color: var(--text-sub); }
    .sim-cell .v { font-family: var(--font-num); font-size: 23px; font-weight: 600; }
    .sim-cell.hl .v { color: #fff; }
    [data-theme='dark'] .sim-cell.hl .v { color: var(--brand-accent); }
    .sim-cell .v .u { font-size: 12px; font-weight: 500; }
    .sim-cell .v .a { color: var(--brand-accent); font-weight: 800; }
    .sim-note { margin-top: 12px; font-size: 11px; color: var(--text-sub); line-height: 1.5; }

    /* ════════════════════════════════════════════════════════════════
       12. PROCESS / TABS / TIMELINE
       ════════════════════════════════════════════════════════════════ */
    .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 36px; }
    .tab-btn { background: transparent; border: 1px solid var(--border); padding: 9px 28px; border-radius: var(--radius-pill); font-size: 13.5px; cursor: pointer; transition: all .3s; color: var(--text-sub); font-family: var(--font-body); }
    .tab-btn.active { background: var(--brand-primary); color: var(--on-accent); border-color: var(--brand-primary); font-weight: 500; }
    [data-theme='dark'] .tab-btn.active { background: var(--brand-accent); color: #0C0C0C; border-color: var(--brand-accent); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: fadeIn .4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .timeline { display: grid; grid-template-columns: repeat(4,1fr); gap: 18px; margin-bottom: 26px; }
    .step-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 24px 22px; text-align: left; cursor: pointer; transition: all .3s; box-shadow: var(--shadow-sm); }
    .step-card:hover { transform: translateY(-8px); border-color: var(--brand-accent); box-shadow: var(--shadow-md); }
    .step-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .step-no { font-family: var(--font-label); font-size: 19px; font-weight: 500; color: var(--ink-3); letter-spacing: .04em; transition: color .3s; }
    .step-card:hover .step-no { color: var(--brand-accent); }
    .step-ic { color: var(--text-sub); }
    .step-ic svg { width: 22px; height: 22px; }
    .step-title { font-size: clamp(15px,1.3vw,20px); font-weight: 700; margin-bottom: 8px; word-break: keep-all; }
    .step-sum { font-size: clamp(12.5px,1vw,15px); color: var(--text-sub); line-height: 1.55; word-break: keep-all; }
    .step-hint { font-size: 12.5px; font-weight: 600; color: var(--brand-accent); opacity: 0; transform: translateX(-8px); transition: all .3s; margin-top: 16px; }
    .step-card:hover .step-hint { opacity: 1; transform: translateX(0); }
    .process-footer { display: inline-block; margin-top: 6px; background: var(--surface); padding: 11px 30px; border-radius: var(--radius-pill); border: 1px solid var(--border); box-shadow: var(--shadow-sm); font-weight: 700; color: var(--brand-accent); }

    /* ════════════════════════════════════════════════════════════════
       13. PACKAGES + CONTACT
       ════════════════════════════════════════════════════════════════ */
    .pkg-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; width: 100%; margin-bottom: 34px; }
    .pkg-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 26px 24px; text-align: left; box-shadow: var(--shadow-sm); transition: transform .3s, box-shadow .3s; position: relative; }
    .pkg-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); }
    .pkg-card.featured { border-color: var(--brand-accent); box-shadow: 0 16px 40px color-mix(in srgb, var(--brand-accent) 25%, transparent); }
    .pkg-featured-tag { position: absolute; top: -11px; right: 20px; background: var(--brand-accent); color: var(--brand-primary); font-size: 10.5px; font-weight: 700; letter-spacing: .1em; padding: 4px 12px; border-radius: var(--radius-pill); }
    .pkg-letter { font-family: var(--font-editorial); font-size: 44px; font-weight: 600; color: var(--brand-accent); line-height: 1; margin-bottom: 12px; }
    .pkg-name { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
    .pkg-desc { font-size: 13.5px; color: var(--text-sub); line-height: 1.6; margin-bottom: 16px; word-break: keep-all; }
    .pkg-items { list-style: none; }
    .pkg-items li { font-size: 13px; color: var(--text-main); padding: 6px 0 6px 20px; position: relative; border-top: 1px solid var(--border); }
    .pkg-items li:first-child { border-top: none; }
    .pkg-items li::before { content: ''; position: absolute; left: 4px; top: 13px; width: 5px; height: 5px; border-radius: 50%; background: var(--brand-accent); }
    .pkg-target { margin-top: 14px; font-size: 12px; color: var(--text-sub); }
    .pkg-target b { color: var(--brand-accent); }

    .contact { width: 100%; border-radius: var(--radius-card); padding: 34px 40px; display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; border: 1px solid var(--line);
        background:
          radial-gradient(60% 90% at 8% 10%, var(--wash-peach), transparent 62%),
          radial-gradient(56% 90% at 96% 90%, var(--wash-lilac), transparent 62%),
          var(--surface-2); }
    .contact-l .ct-eyebrow { font-family: var(--font-label); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--brand-accent); margin-bottom: 8px; }
    .contact-l .ct-title { font-family: var(--font-display); font-size: clamp(22px,2.4vw,34px); color: var(--ink); font-weight: 600; letter-spacing: -.02em; word-break: keep-all; }
    .contact-r { display: flex; flex-direction: column; gap: 8px; }
    .contact-item { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 14.5px; text-decoration: none; }
    .contact-item svg { width: 17px; height: 17px; color: var(--brand-accent); }
    .contact-item:hover { color: var(--ink); }

    .cap-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 30px; }
    .cap-chip { font-size: 13px; color: var(--text-main); background: var(--surface); border: 1px solid var(--border); padding: 8px 16px; border-radius: var(--radius-pill); }
    .cap-chip b { color: var(--brand-accent); }

    /* ════════════════════════════════════════════════════════════════
       14. MODAL + DATA TABLE
       ════════════════════════════════════════════════════════════════ */
    .modal-overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--brand-primary) 45%, transparent); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .4s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal { background: var(--surface); border-radius: 12px; width: 92%; max-width: 820px; max-height: 84vh; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); transform: translateY(20px); transition: transform .4s var(--ease-out); }
    .modal-overlay.active .modal { transform: translateY(0); }
    .modal-header { padding: 22px 28px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .modal-title { font-family: var(--font-display); font-size: 21px; font-weight: 500; }
    .modal-tools { display: flex; gap: 12px; align-items: center; }
    .modal-close { background: none; border: none; font-size: 26px; cursor: pointer; color: var(--text-sub); line-height: 1; }
    .modal-close:hover { color: var(--text-main); }
    .modal-body { overflow: auto; }

    .modal-stats { display: flex; gap: 14px; padding: 22px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
    .stat-box { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 15px; text-align: center; }
    .stat-box .k { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
    .stat-box .v { font-family: var(--font-num); font-size: 22px; font-weight: 600; }
    .stat-box .v.accent { color: var(--brand-accent); }

    .table-tools { display: flex; gap: 10px; padding: 16px 22px 0; align-items: center; flex-wrap: wrap; }
    .search-box { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 8px 16px; flex: 1; min-width: 180px; }
    .search-box svg { width: 15px; height: 15px; color: var(--text-sub); }
    .search-box input { background: none; border: none; outline: none; color: var(--text-main); font-family: var(--font-body); font-size: 14px; width: 100%; }
    .table-count { font-size: 12.5px; color: var(--text-sub); white-space: nowrap; }

    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td { padding: 13px 18px; text-align: center; border-bottom: 1px solid var(--border); font-size: 14px; }
    .data-table th { background: var(--surface); font-family: var(--font-label); font-weight: 500; font-size: 11px; text-transform: uppercase; color: var(--text-sub); letter-spacing: .08em; position: sticky; top: 0; z-index: 10; cursor: pointer; user-select: none; }
    .data-table th.sorted { color: var(--brand-accent); }
    .data-table td.name-col { font-weight: 700; text-align: left; }
    .data-table tr:hover td { background: var(--surface-2); }
    .data-table a { color: var(--text-sub); text-decoration: none; }
    .data-table a:hover { color: var(--brand-accent); }
    .empty-row td { padding: 40px; color: var(--text-sub); }

    /* process modal */
    .modal.bare { background: transparent; box-shadow: none; max-width: 680px; align-items: center; }
    .modal.bare .modal-body { width: 100%; }
    .proc-text { background: var(--surface); padding: 34px 40px; border-radius: 14px; box-shadow: var(--shadow-lg); }
    .proc-text h3 { font-family: var(--font-display); font-size: 22px; font-weight: 500; color: var(--text-main); border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
    .proc-text ul { padding-left: 20px; }
    .proc-text li { font-size: 15px; line-height: 1.8; color: var(--text-main); }
    .proc-img { max-width: 100%; max-height: 64vh; object-fit: contain; border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); background: var(--surface); padding: 18px; }
    .proc-links { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
    .proc-note { margin-top: 12px; font-size: 13px; color: var(--text-sub); text-align: center; }

    /* ════════════════════════════════════════════════════════════════
       15. SIMPLE SHEET (간단 PDF 전용 — 화면에선 숨김)
       ════════════════════════════════════════════════════════════════ */
    .simple-sheet { display: none; }

    /* ════════════════════════════════════════════════════════════════
       16. RESPONSIVE (모바일)
       ════════════════════════════════════════════════════════════════ */
    @media (max-width: 860px) {
        .slide { padding: 30px 18px 96px; }
        .cover-layout { grid-template-columns: 1fr; gap: 30px; text-align: center; }
        .cover-text { align-items: center; }
        .cover-figure { aspect-ratio: 16/10; max-height: 34vh; }
        .sample-flag { left: 50%; transform: translateX(-50%); }
        .feature-grid { grid-template-columns: 1fr; gap: 16px; }
        .curation-grid { grid-template-columns: repeat(2,1fr); gap: 16px; }
        .timeline { grid-template-columns: 1fr; gap: 14px; }
        .pkg-grid { grid-template-columns: 1fr; }
        .sim-metrics { grid-template-columns: repeat(2,1fr); }
        .ref-strip, .contact { flex-direction: column; align-items: flex-start; }
        .modal-stats { flex-direction: column; }
        .nav-brand { display: none; }
        .bottom-nav { justify-content: flex-start; gap: 5px; overflow-x: auto; padding: 0 12px; -webkit-overflow-scrolling: touch; }
        .bottom-nav::-webkit-scrollbar { display: none; }
        .nav-btn { flex: 0 0 auto; padding: 8px 13px; font-size: 12.5px; }
        .toolbar { top: 10px; right: 10px; gap: 6px; }
        .tool-btn span.lbl { display: none; }
        .tool-btn { padding: 8px; }
        .data-table th, .data-table td { padding: 10px 12px; font-size: 12.5px; }
    }

    /* ════════════════════════════════════════════════════════════════
       17. PRINT — 전체 PDF (화면 그대로 펼침)
       ════════════════════════════════════════════════════════════════ */
    @media print {
        @page { size: A4 landscape; margin: 10mm; }
        .toolbar, .bottom-nav, .step-hint, .modal-overlay { display: none !important; }
        body { overflow: visible !important; background: var(--paper) !important; }
        #app { height: auto !important; width: auto !important; }
        .slide {
            position: static !important; opacity: 1 !important; height: auto !important;
            page-break-after: always; page-break-inside: avoid; overflow: visible !important;
            padding: 18px 10px !important; min-height: 92vh; justify-content: center;
        }
        .slide:last-child { page-break-after: auto; }
        .fade-up { opacity: 1 !important; transform: none !important; }
        .cover-slide { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .feature-card, .step-card, .pkg-card, .sim, .compare, .ref-strip, .contact { break-inside: avoid; box-shadow: none; }

        /* 간단 PDF 모드: 슬라이드 숨기고 요약 시트만 */
        body.print-simple #app { display: none !important; }
        body.print-simple .simple-sheet { display: block !important; }
    }
    /* 색 보존 (인쇄) */
    @media print {
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }

    /* SIMPLE SHEET 레이아웃 (인쇄 시) */
    .simple-sheet { font-family: var(--font-body); color: var(--text-main); padding: 4mm; }
    .ss-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--brand-primary); padding-bottom: 12px; margin-bottom: 16px; }
    .ss-brand { font-family: var(--font-display); font-size: 30px; }
    .ss-brand .x { font-size: 15px; color: var(--text-sub); }
    .ss-meta { text-align: right; font-size: 11px; color: var(--text-sub); line-height: 1.5; }
    .ss-tagline { font-family: var(--font-display); font-style: italic; font-size: 16px; color: var(--brand-primary); margin-bottom: 16px; }
    .ss-kpi { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 16px; }
    .ss-kpi .cell { border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
    .ss-kpi .cell .v { font-family: var(--font-num); font-size: 22px; font-weight: 600; color: var(--brand-primary); }
    .ss-kpi .cell .k { font-size: 10.5px; color: var(--text-sub); margin-top: 3px; }
    .ss-cols { display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; }
    .ss-box h4 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--brand-accent); margin-bottom: 8px; }
    .ss-pkg { font-size: 12px; line-height: 1.7; }
    .ss-pkg b { color: var(--brand-primary); }
    .ss-scenario { width: 100%; border-collapse: collapse; font-size: 12px; }
    .ss-scenario td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
    .ss-scenario td:last-child { text-align: right; font-family: var(--font-num); font-weight: 600; color: var(--brand-primary); }
    .ss-contact { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; font-size: 12px; color: var(--text-sub); display: flex; gap: 18px; flex-wrap: wrap; }
    .ss-contact b { color: var(--brand-primary); }
    </style>
</head>
<body>

    <!-- ════════ TOOLBAR ════════ -->
    <div class="toolbar" id="toolbar"></div>

    <!-- ════════ SLIDES (대부분 JS 렌더) ════════ -->
    <div id="app">
        <section class="slide active cover-slide" id="slide-1">
            <div class="sample-flag" id="sampleFlag">Sample · 가상 레퍼런스</div>
            <div class="container cover-layout">
                <div class="cover-text fade-up" id="coverText"></div>
                <div class="cover-figure fade-up d1" id="coverFigure"></div>
            </div>
        </section>

        <section class="slide" id="slide-2">
            <div class="container center">
                <div class="eyebrow fade-up" id="s2-eyebrow"></div>
                <h2 class="slide-title fade-up" id="s2-title"></h2>
                <div class="feature-grid" id="whyGrid"></div>
            </div>
        </section>

        <section class="slide" id="slide-3">
            <div class="container center" style="max-width:1060px">
                <div class="eyebrow fade-up" id="s3-eyebrow"></div>
                <h2 class="slide-title fade-up" id="s3-title" style="margin-bottom:24px"></h2>
                <div class="fade-up d1" id="compareMount"></div>
                <div class="curation-grid fade-up d2" id="curationGrid"></div>
                <div class="fade-up d3" style="display:flex;flex-direction:column;align-items:center;gap:10px">
                    <button class="btn" id="openListBtn"></button>
                    <p class="note" id="s3-note"></p>
                </div>
            </div>
        </section>

        <section class="slide" id="slide-4">
            <div class="container center">
                <div class="eyebrow fade-up" id="s4-eyebrow"></div>
                <h2 class="slide-title fade-up" id="s4-title" style="margin-bottom:28px"></h2>
                <div class="feature-grid" id="strategyGrid"></div>
                <div class="fade-up d2" id="refMount"></div>
                <div class="fade-up d3" id="simMount"></div>
            </div>
        </section>

        <section class="slide" id="slide-5">
            <div class="container center">
                <div class="eyebrow fade-up" id="s5-eyebrow"></div>
                <h2 class="slide-title fade-up" id="s5-title" style="margin-bottom:24px"></h2>
                <div class="tabs fade-up" id="procTabs"></div>
                <div id="procPanes"></div>
            </div>
        </section>

        <section class="slide" id="slide-6">
            <div class="container center">
                <div class="eyebrow fade-up" id="s6-eyebrow"></div>
                <h2 class="slide-title fade-up" id="s6-title"></h2>
                <p class="slide-sub fade-up" id="s6-sub"></p>
                <div class="cap-list fade-up d1" id="capList"></div>
                <div class="pkg-grid fade-up d2" id="pkgGrid"></div>
                <div class="fade-up d3" id="contactMount"></div>
            </div>
        </section>
    </div>

    <!-- ════════ BOTTOM NAV ════════ -->
    <nav class="bottom-nav" id="bottomNav"></nav>

    <!-- ════════ MODALS ════════ -->
    <div class="modal-overlay" id="modal-list" onclick="if(event.target===this)closeModal('modal-list')">
        <div class="modal" role="dialog" aria-modal="true" aria-label="인플루언서 전체 리스트">
            <div class="modal-header">
                <h3 class="modal-title" id="listModalTitle"></h3>
                <div class="modal-tools" id="listModalTools"></div>
            </div>
            <div class="modal-body">
                <div class="modal-stats" id="listStats"></div>
                <div class="table-tools">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="searchInput" placeholder="이름·핸들 검색…" aria-label="인플루언서 검색">
                    </div>
                    <div class="table-count" id="tableCount"></div>
                </div>
                <table class="data-table" id="dataTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-proc" onclick="if(event.target===this)closeModal('modal-proc')">
        <div class="modal bare" role="dialog" aria-modal="true">
            <div style="display:flex;justify-content:flex-end;width:100%;padding-bottom:12px">
                <button class="modal-close" style="color:#fff;font-size:38px;text-shadow:0 2px 6px rgba(0,0,0,.5)" onclick="closeModal('modal-proc')" aria-label="닫기">&times;</button>
            </div>
            <div class="modal-body" id="procBody"></div>
        </div>
    </div>

    <!-- ════════ SIMPLE SHEET (간단 PDF 전용) ════════ -->
    <div class="simple-sheet" id="simpleSheet"></div>

    <!-- ════════════════════════════════════════════════════════════════
         ▼▼▼  여기만 수정하세요 — 브랜드 1개 = config 1개  ▼▼▼
         새 브랜드: 이 BRAND 객체만 갈아끼우면 대시보드 전체가 재생성됩니다.
         (집계 KPI·테마·PDF·마스킹은 엔진이 자동 처리)
         ════════════════════════════════════════════════════════════════ -->
    <script id="brand-config">
    const BRAND = {
        meta: {
            name: 'AURELLE',
            agency: 'SIRIAI',
            mode: 'public',          // 'public'(대외 공유) | 'internal'(원가·실명 노출)  ※ URL ?mode=internal 로도 전환
            theme: 'light',          // 'light' | 'dark'
            preparedAt: '2026.06',
            confidential: '대외비 · Confidential',
            docTitle: 'AURELLE × SIRIAI | Global Short-form Campaign',
            sample: true             // 가상 레퍼런스 플래그(표지 'Sample' 배지). 실제 브랜드면 false
        },
        brandKit: {
            // SIRIAI 하우스 스타일(Paper/Ink/Helvetica·Pretendard·JetBrains Mono)은 엔진에 고정.
            // 여기선 클라이언트 '악센트'만 절제해서 지정(웜 클레이/브랜드색). 폰트·베이스는 건드리지 않음.
            colors: { accent: '#B27B53', accentSoft: '#C9A07B' },  // wash: '...' 로 표지 웜워시 톤도 지정 가능
            logo:   null,            // 예: 'assets/aurelle/logo.svg' (없으면 이름 워드마크 — Helvetica)
            coverImage: null,        // 예: 'assets/aurelle/atelier.jpg' (없으면 웜워시 플레이스홀더)
            coverCaption: 'SEOUL · LOS ANGELES'
        },
        copy: {
            eyebrow: 'Global Short-form Campaign Proposal',
            tagline: '맑게 비치되 흔들리지 않는, 투명한 깊이.',
            coverDesc: '한국 비건 포뮬러의 정직함을 글로벌 숏폼으로.<br>Prepared by SIRIAI · 2026.06',

        if (c.wash)       r.style.setProperty('--wash-peach', c.wash);  // 선택: 클라 톤 웜워시
        // 폰트는 SIRIAI 5종 고정(Helvetica/Pretendard/JetBrains Mono/Bodoni) — config로 바꾸지 않음.

        // 메타/OG
        document.title = B.meta.docTitle;
        setMeta('name','description', B.copy.shareDesc);
        setMeta('property','og:title', B.meta.docTitle);
        setMeta('property','og:description', B.copy.shareDesc);
        if(B.share && B.share.image){ setMeta('property','og:image', B.share.image); setMeta('name','twitter:image', B.share.image); }

        state.total = (B.nav||[]).length || 6;
        renderToolbar(B);
        renderNav(B);
        renderCover(B);
        renderWhy(B);
        renderDomestic(B);
        renderOverseas(B);
        renderProcess(B);
        renderClosing(B);
        renderSimpleSheet(B);

        document.getElementById('sampleFlag').style.display = B.meta.sample ? '' : 'none';
        triggerAnim(1);
    }
    function setMeta(attr, key, val){
        let el=document.querySelector(`meta[${attr}="${key}"]`);
        if(!el){ el=document.createElement('meta'); el.setAttribute(attr,key); document.head.appendChild(el); }
        el.setAttribute('content', val);
    }

    /* ════════ 집계 (reduce 파생 — 하드코딩 금지) ════════ */
    function kpis(B){
        const a = B.domestic.influencers;
        return {
            count: a.length,
            followers: a.reduce((s,i)=>s+i.followers,0),
            views: a.reduce((s,i)=>s+i.views,0),
            avgEr: (a.reduce((s,i)=>s+i.er,0)/a.length)
        };
    }

    function maskName(name){ return name; } // public에서도 가상 더미라 노출. 실데이터 마스킹 필요 시 여기서 이니셜화.

    function renderTable(B){
        const cols=[
            {key:'no',label:'No.'},{key:'name',label:'이름',name:true},
            {key:'followers',label:'팔로워'},{key:'views',label:'예상 조회수'},
            {key:'er',label:'ER'}
        ];
        if(MODE==='internal') cols.push({key:'costKRW',label:'예상 단가'});
        cols.push({key:'ig',label:'Instagram'});

        document.getElementById('tableHead').innerHTML='<tr>'+cols.map(c=>{
            const on=state.sortKey===c.key;
            const aria=on?(state.sortDir>0?'ascending':'descending'):'none';
            return `<th class="${on?'sorted':''}" role="columnheader" aria-sort="${aria}" tabindex="0" onclick="sortTable('${c.key}', window.__B)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();sortTable('${c.key}', window.__B);}">${c.label}${on?(state.sortDir>0?' ▲':' ▼'):''}</th>`;
        }).join('')+'</tr>';

        let rows=B.domestic.influencers.filter(i=>{
            if(!state.search) return true;
            return i.name.toLowerCase().includes(state.search)||i.ig.toLowerCase().includes(state.search);
        });
        const sk=state.sortKey;
        rows.sort((a,b)=>{
            let va=a[sk], vb=b[sk];
            if(typeof va==='string') return state.sortDir*va.localeCompare(vb);
            return state.sortDir*(va-vb);
        });
        document.getElementById('tableCount').textContent=`${rows.length}명 표시`;
        const tb=document.getElementById('tableBody');
        if(!rows.length){ tb.innerHTML=`<tr class="empty-row"><td colspan="${cols.length}">검색 결과가 없습니다.</td></tr>`; return; }
        tb.innerHTML=rows.map(i=>'<tr>'+cols.map(c=>{
            if(c.name) return `<td class="name-col">${maskName(i.name)}</td>`;
            if(c.key==='followers') return `<td>${fmtK(i.followers)}</td>`;
            if(c.key==='views') return `<td>${fmtK(i.views)}</td>`;
            if(c.key==='er') return `<td>${i.er}%</td>`;
            if(c.key==='costKRW') return `<td>${maskCost(i.costKRW,MODE)}</td>`;
            if(c.key==='ig') return `<td><a href="https://instagram.com/${i.ig.replace('@','')}" target="_blank" rel="noopener">${i.ig} ↗</a></td>`;
            return `<td>${i[c.key]}</td>`;
        }).join('')+'</tr>').join('');
    }
    function sortTable(key,B){ if(state.sortKey===key) state.sortDir*=-1; else { state.sortKey=key; state.sortDir=1; } renderTable(B); }

    function renderSim(B){
        const S=B.overseas.simulator;
        document.getElementById('simMount').innerHTML=`
            <div class="sim">
                <div class="sim-head">
                    <div><div class="sim-eyebrow">${S.eyebrow}</div><h3 class="sim-title">${S.title}</h3></div>
                    <div class="sim-budget num" id="simBudget"></div>
                </div>
                <input type="range" class="sim-slider" id="simSlider" min="${S.min}" max="${S.max}" step="${S.step}" value="${S.initial}" aria-label="예산 슬라이더(만원)">
                <div class="sim-metrics">
                    <div class="sim-cell"><div class="k">콘텐츠 자산</div><div class="v"><span id="sim-c">0</span><span class="u"> 개+</span></div></div>
                    <div class="sim-cell"><div class="k">잠재 노출 범위</div><div class="v"><span id="sim-r">0</span><span class="u"> 명+</span></div></div>
                    <div class="sim-cell"><div class="k">예상 최소 오가닉 뷰</div><div class="v"><span id="sim-v">0</span><span class="u a"> +α</span></div></div>
                    <div class="sim-cell hl"><div class="k">예상 최소 인게이지먼트</div><div class="v"><span id="sim-e">0</span><span class="u a"> +α</span></div></div>
                </div>
                <div class="sim-note">${S.note}</div>
            </div>`;
        const sl=document.getElementById('simSlider');
        const calc=(val)=>{
            const c=Math.floor(val/S.contentsPerUnit);
            const r=c*S.reachPerContent, v=c*S.viewsPerContent, e=Math.floor(v*S.engRate);
            document.getElementById('simBudget').textContent=fmt(val*10000)+' KRW';
            document.getElementById('sim-c').textContent=fmt(c);
            document.getElementById('sim-r').textContent=fmt(r);
            document.getElementById('sim-v').textContent=fmt(v);
            document.getElementById('sim-e').textContent=fmt(e);
        };
        sl.oninput=e=>calc(parseInt(e.target.value));
        calc(parseInt(sl.value));
    }

    function switchTab(ev,id){
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
        ev.currentTarget.classList.add('active');
        document.getElementById('pane-'+id).classList.add('active');
    }
    function showStep(s){
        const d=s.detail; let html='';
        if(d.type==='image'){
            html=`<img class="proc-img" src="${d.src}" alt="${s.title}">`;
            if(d.links) html+=`<div class="proc-links">${d.links.map(l=>`<a class="btn" href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('')}</div>`;
            if(d.note) html+=`<p class="proc-note">${d.note}</p>`;
        } else {
            html=`<div class="proc-text"><h3>${d.heading}</h3><ul>${d.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`;
            if(d.links) html+=`<div class="proc-links">${d.links.map(l=>`<a class="btn" href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('')}</div>`;
            html+=`</div>`;
        }
        document.getElementById('procBody').innerHTML=html;
        openModal('modal-proc');
    }

    /* ════════ PDF EXPORT ════════ */
    function exportPDF(kind){
        // 인쇄 전 모든 막대 채우기 (빈 슬라이드 방지)
        document.querySelectorAll('.compare-fill').forEach(b=>b.style.width=b.getAttribute('data-target'));
        if(kind==='simple') document.body.classList.add('print-simple');
        const cleanup=()=>{ document.body.classList.remove('print-simple'); window.removeEventListener('afterprint',cleanup); };
        window.addEventListener('afterprint',cleanup);
        setTimeout(()=>window.print(), 60);
    }

    /* ════════ NAV / ANIM ════════ */
    function triggerAnim(index){
        const slide=document.getElementById('slide-'+index);
        if(!slide) return;
        if(index===3){ setTimeout(()=>slide.querySelectorAll('.compare-fill').forEach(b=>b.style.width=b.getAttribute('data-target')),400); }
    }
    function goToSlide(index){
        if(index<1||index>state.total) return;
        state.slide=index;
        document.querySelectorAll('.nav-btn').forEach((b,i)=>{ const on=i+1===index; b.classList.toggle('active',on); if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
        document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('active',i+1===index));
        const active=document.getElementById('slide-'+index); if(active) active.scrollTop=0;
        const nav=document.getElementById('bottomNav'), btn=document.querySelectorAll('.nav-btn')[index-1];
        if(nav&&btn&&nav.scrollWidth>nav.clientWidth+1) nav.scrollTo({left:btn.offsetLeft-nav.clientWidth/2+btn.offsetWidth/2,behavior:'smooth'});
        triggerAnim(index);
    }
    let _lastFocus=null, _trapEl=null;
    function _focusables(el){ return [...el.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(n=>n.offsetParent!==null); }
    function _trap(e){
        if(e.key!=='Tab'||!_trapEl) return;
        const f=_focusables(_trapEl); if(!f.length) return;
        const first=f[0], last=f[f.length-1];
        if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    }
    function openModal(id){
        const m=document.getElementById(id);
        _lastFocus=document.activeElement;
        m.classList.add('active');
        _trapEl=m.querySelector('.modal');
        document.addEventListener('keydown',_trap);
        const f=_focusables(_trapEl); if(f.length) setTimeout(()=>f[0].focus(),50);
    }
    function closeModal(id){
        const m=document.getElementById(id); m.classList.remove('active');
        document.removeEventListener('keydown',_trap); _trapEl=null;
        if(_lastFocus){ _lastFocus.focus(); _lastFocus=null; }
    }
    function closeAnyModal(){ const o=document.querySelector('.modal-overlay.active'); if(o) closeModal(o.id); }

    /* 키보드 / 휠 / 스와이프 */
    document.addEventListener('keydown',e=>{
        const open=document.querySelector('.modal-overlay.active');
        if(e.key==='Escape'&&open){ closeAnyModal(); return; }
        if(open) return;
        if(e.key==='ArrowRight'||e.key==='ArrowDown'){ if(state.slide<state.total) goToSlide(state.slide+1); }
        else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ if(state.slide>1) goToSlide(state.slide-1); }
        else if(e.key.toLowerCase()==='f'){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
    });
    window.addEventListener('wheel',e=>{
        if(document.querySelector('.modal-overlay.active')) return;
        const s=document.querySelector('.slide.active');
        if(s&&s.scrollHeight>s.clientHeight+1){
            const atTop=s.scrollTop<=0, atBot=s.scrollTop+s.clientHeight>=s.scrollHeight-1;
            if(e.deltaY>0&&!atBot) return; if(e.deltaY<0&&!atTop) return;
        }
        if(Math.abs(e.deltaY)<12) return;
        e.preventDefault();
        if(state.scrolling) return; state.scrolling=true;
        if(e.deltaY>0){ if(state.slide<state.total) goToSlide(state.slide+1); }
        else if(state.slide>1) goToSlide(state.slide-1);
        setTimeout(()=>state.scrolling=false,700);
    },{passive:false});
    let touchX=null;
    window.addEventListener('touchstart',e=>{ if(!document.querySelector('.modal-overlay.active')) touchX=e.touches[0].clientX; });
    window.addEventListener('touchend',e=>{
        if(touchX===null||document.querySelector('.modal-overlay.active')) return;
        const dx=e.changedTouches[0].clientX-touchX; touchX=null;
        if(Math.abs(dx)<60) return;
        if(dx<0){ if(state.slide<state.total) goToSlide(state.slide+1); }
        else if(state.slide>1) goToSlide(state.slide-1);
    });

    /* ════════ INIT ════════ */
    window.__B = BRAND;
    document.addEventListener('DOMContentLoaded',()=>applyBrand(BRAND));
    </script>
</body>
